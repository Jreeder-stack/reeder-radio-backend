name: Apply conversational AI to main

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ai-dispatcher-conversational-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply conversational AI files from validated branch
        run: |
          git fetch origin agent/ai-dispatcher-conversational-agent-phase1
          git checkout origin/agent/ai-dispatcher-conversational-agent-phase1 -- \
            docs/AI_DISPATCHER_V2.md \
            src/services/aiDispatchService.js \
            src/services/dispatcherV2Planner.js \
            src/services/__tests__/dispatcherV2Conversation.test.js

      - name: Install dependencies
        run: npm ci

      - name: Validate conversational dispatcher
        run: |
          node --check src/services/dispatcherV2Planner.js
          node --check src/services/aiDispatchService.js
          npx vitest run \
            src/services/__tests__/dispatcherV2Conversation.test.js \
            src/services/__tests__/aiDispatch.task542.test.js \
            src/services/__tests__/locationService.cadResolver.test.js

      - name: Commit validated implementation
        run: |
          rm -f .github/workflows/apply-conversational-ai-main.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep AI active across dispatcher follow-up turns"
          timeout 60s git push --no-verify origin HEAD:${{ github.event.pull_request.head.ref }}
