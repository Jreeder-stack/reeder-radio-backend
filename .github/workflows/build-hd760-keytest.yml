name: Build HD760 Key Test APK

on:
  push:
    branches:
      - feature/hd760-hardware-diagnostics-20261028
    paths:
      - "hd760-keytest/**"
      - ".github/workflows/build-hd760-keytest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-hd760-keytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android API 34 (runner SDK)
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"
      - name: Build diagnostics APK
        run: gradle -p hd760-keytest :app:assembleDebug --stacktrace
      - name: Upload diagnostics APK
        uses: actions/upload-artifact@v4
        with:
          name: command-comms-hd760-keytest
          path: hd760-keytest/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
