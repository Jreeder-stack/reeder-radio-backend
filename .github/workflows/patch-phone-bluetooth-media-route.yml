name: Patch phone Bluetooth media route

on:
  push:
    branches:
      - fix/phone-bluetooth-media-route

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-bluetooth-media-route
          fetch-depth: 0
      - name: Apply phone media-route patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Shared background service: phone flavor must never enter Android's
          # communication/call route or select a communication device.
          p = Path('android-native/app/src/main/java/com/reedersystems/commandcomms/audio/BackgroundAudioService.kt')
          s = p.read_text()
          needle = '''    private fun applyOutputDeviceSelection(reason: String) {\n        if (!::audioManager.isInitialized) return\n'''
          repl = '''    private fun applyOutputDeviceSelection(reason: String) {\n        if (!::audioManager.isInitialized) return\n        if (com.reedersystems.commandcomms.BuildConfig.RADIO_DEVICE_TYPE == "android_phone") {\n            // Phones use the normal MEDIA route. Never claim a communication\n            // device here: that switches Bluetooth into HFP/SCO and makes the\n            // radio session appear to the OS/headset as a phone call.\n            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {\n                runCatching { audioManager.clearCommunicationDevice() }\n            } else {\n                @Suppress("DEPRECATION")\n                runCatching { audioManager.stopBluetoothSco() }\n                @Suppress("DEPRECATION")\n                runCatching { audioManager.isBluetoothScoOn = false }\n            }\n            Log.d(TAG, "{\\\"event\\\":\\\"PHONE_MEDIA_ROUTE_DEVICE_SELECT\\\",\\\"reason\\\":\\\"$reason\\\"}")\n            return\n        }\n'''
          if needle not in s: raise SystemExit('Background applyOutputDeviceSelection anchor not found')
          s = s.replace(needle, repl, 1)

          needle = '''        radioRouteActive = true\n        if (!::audioManager.isInitialized) return\n        if (audioManager.mode != AudioManager.MODE_IN_COMMUNICATION) {\n            audioManager.mode = AudioManager.MODE_IN_COMMUNICATION\n        }\n'''
          repl = '''        radioRouteActive = true\n        if (!::audioManager.isInitialized) return\n        if (com.reedersystems.commandcomms.BuildConfig.RADIO_DEVICE_TYPE == "android_phone") {\n            // Keep handset radio audio on Android's normal MEDIA/A2DP path.\n            // Bluetooth microphone capture would require HFP/SCO, which is the\n            // exact call-profile behavior we do not want on the phone flavor.\n            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {\n                runCatching { audioManager.clearCommunicationDevice() }\n            } else {\n                @Suppress("DEPRECATION")\n                runCatching { audioManager.stopBluetoothSco() }\n                @Suppress("DEPRECATION")\n                runCatching { audioManager.isBluetoothScoOn = false }\n            }\n            if (audioManager.mode != AudioManager.MODE_NORMAL) {\n                audioManager.mode = AudioManager.MODE_NORMAL\n            }\n            Log.d(TAG, "{\\\"event\\\":\\\"PHONE_MEDIA_ROUTE_APPLIED\\\",\\\"mode\\\":\\\"NORMAL\\\"}")\n            return\n        }\n        if (audioManager.mode != AudioManager.MODE_IN_COMMUNICATION) {\n            audioManager.mode = AudioManager.MODE_IN_COMMUNICATION\n        }\n'''
          if needle not in s: raise SystemExit('Background applyRadioAudioRoute anchor not found')
          s = s.replace(needle, repl, 1)

          needle = '''        if (!radioRouteActive) return\n        radioRouteActive = false\n        if (!::audioManager.isInitialized) return\n'''
          repl = '''        if (!radioRouteActive) return\n        radioRouteActive = false\n        if (!::audioManager.isInitialized) return\n        if (com.reedersystems.commandcomms.BuildConfig.RADIO_DEVICE_TYPE == "android_phone") {\n            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {\n                runCatching { audioManager.clearCommunicationDevice() }\n            } else {\n                @Suppress("DEPRECATION")\n                runCatching { audioManager.stopBluetoothSco() }\n                @Suppress("DEPRECATION")\n                runCatching { audioManager.isBluetoothScoOn = false }\n            }\n            audioManager.mode = AudioManager.MODE_NORMAL\n            Log.d(TAG, "{\\\"event\\\":\\\"PHONE_MEDIA_ROUTE_RELEASED\\\",\\\"mode\\\":\\\"NORMAL\\\"}")\n            return\n        }\n'''
          if needle not in s: raise SystemExit('Background releaseRadioAudioRoute anchor not found')
          s = s.replace(needle, repl, 1)
          p.write_text(s)

          # 2) RX playback: phone flavor uses MEDIA so Bluetooth stays A2DP,
          # while T320/SD7 retain VOICE_COMMUNICATION and their volume behavior.
          p = Path('android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/AudioPlayback.kt')
          s = p.read_text()
          if 'import com.reedersystems.commandcomms.BuildConfig\n' not in s:
              s = s.replace('import android.util.Log\n', 'import android.util.Log\nimport com.reedersystems.commandcomms.BuildConfig\n', 1)
          needle = '''        val minBufferSize = AudioTrack.getMinBufferSize(SAMPLE_RATE, channelConfig, audioFormat)\n        val bufferSize = maxOf(minBufferSize, OpusCodec.DECODER_FRAME_SIZE * 2 * 4)\n\n        Log.d(TAG, "AUDIOTRACK_INIT rate=$SAMPLE_RATE channelConfig=MONO format=PCM_16BIT minBufSize=$minBufferSize allocBufSize=$bufferSize perfMode=LOW_LATENCY ${RadioDiagLog.elapsedTag()}")\n'''
          repl = '''        val minBufferSize = AudioTrack.getMinBufferSize(SAMPLE_RATE, channelConfig, audioFormat)\n        val bufferSize = maxOf(minBufferSize, OpusCodec.DECODER_FRAME_SIZE * 2 * 4)\n        val playbackUsage = if (BuildConfig.RADIO_DEVICE_TYPE == "android_phone")\n            AudioAttributes.USAGE_MEDIA else AudioAttributes.USAGE_VOICE_COMMUNICATION\n\n        Log.d(TAG, "AUDIOTRACK_INIT rate=$SAMPLE_RATE channelConfig=MONO format=PCM_16BIT minBufSize=$minBufferSize allocBufSize=$bufferSize perfMode=LOW_LATENCY usage=$playbackUsage ${RadioDiagLog.elapsedTag()}")\n'''
          if needle not in s: raise SystemExit('AudioPlayback init anchor not found')
          s = s.replace(needle, repl, 1)
          needle = '.setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION)'
          if needle not in s: raise SystemExit('AudioPlayback usage anchor not found')
          s = s.replace(needle, '.setUsage(playbackUsage)', 1)
          p.write_text(s)

          # 3) TX capture: on phones do not prefer VOICE_COMMUNICATION because
          # that can pull Bluetooth into HFP/SCO. Use the phone microphone path.
          p = Path('android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/AudioCapture.kt')
          s = p.read_text()
          if 'import com.reedersystems.commandcomms.BuildConfig\n' not in s:
              s = s.replace('import android.util.Log\n', 'import android.util.Log\nimport com.reedersystems.commandcomms.BuildConfig\n', 1)
          needle = '''        val candidates = mutableListOf(\n            Candidate(MediaRecorder.AudioSource.VOICE_COMMUNICATION, "VOICE_COMMUNICATION", 3),\n            Candidate(MediaRecorder.AudioSource.VOICE_RECOGNITION, "VOICE_RECOGNITION", 2),\n            Candidate(MediaRecorder.AudioSource.MIC, "MIC", 1)\n        )\n'''
          repl = '''        val candidates = if (BuildConfig.RADIO_DEVICE_TYPE == "android_phone") {\n            // A Bluetooth headset microphone is only exposed through HFP/SCO,\n            // which Android presents as call audio. Keep phone TX on the handset\n            // mic/normal capture path so connected Bluetooth remains A2DP media.\n            mutableListOf(\n                Candidate(MediaRecorder.AudioSource.MIC, "MIC", 3),\n                Candidate(MediaRecorder.AudioSource.UNPROCESSED, "UNPROCESSED", 2),\n                Candidate(MediaRecorder.AudioSource.VOICE_RECOGNITION, "VOICE_RECOGNITION", 1)\n            )\n        } else {\n            mutableListOf(\n                Candidate(MediaRecorder.AudioSource.VOICE_COMMUNICATION, "VOICE_COMMUNICATION", 3),\n                Candidate(MediaRecorder.AudioSource.VOICE_RECOGNITION, "VOICE_RECOGNITION", 2),\n                Candidate(MediaRecorder.AudioSource.MIC, "MIC", 1)\n            )\n        }\n'''
          if needle not in s: raise SystemExit('AudioCapture candidates anchor not found')
          s = s.replace(needle, repl, 1)
          # Avoid adding UNPROCESSED twice on phone builds.
          needle = '''        if (Build.VERSION.SDK_INT >= 24) {\n            candidates.add(Candidate(MediaRecorder.AudioSource.UNPROCESSED, "UNPROCESSED", 0))\n        }\n'''
          repl = '''        if (Build.VERSION.SDK_INT >= 24 && BuildConfig.RADIO_DEVICE_TYPE != "android_phone") {\n            candidates.add(Candidate(MediaRecorder.AudioSource.UNPROCESSED, "UNPROCESSED", 0))\n        }\n'''
          if needle not in s: raise SystemExit('AudioCapture unprocessed anchor not found')
          s = s.replace(needle, repl, 1)
          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-native/app/src/main/java/com/reedersystems/commandcomms/audio/BackgroundAudioService.kt \
                  android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/AudioPlayback.kt \
                  android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/AudioCapture.kt
          git diff --cached --check
          git commit -m "Fix phone Bluetooth routing to use media instead of call audio"
          git push origin HEAD:fix/phone-bluetooth-media-route
