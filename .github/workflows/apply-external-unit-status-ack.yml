name: Apply external unit status acknowledgement

on:
  push:
    branches:
      - fix/external-unit-status-ack
    paths:
      - tools/apply-external-unit-status-ack.mjs
      - .github/workflows/apply-external-unit-status-ack.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/external-unit-status-ack
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply focused patch
        run: node tools/apply-external-unit-status-ack.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression tests
        run: npx vitest run src/services/__tests__/aiDispatch.task541.test.js

      - name: Validate service syntax
        run: node --check src/services/aiDispatchService.js

      - name: Commit tested implementation
        run: |
          rm -f tools/apply-external-unit-status-ack.mjs .github/workflows/apply-external-unit-status-ack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/aiDispatchService.js src/services/__tests__/aiDispatch.task541.test.js tools/apply-external-unit-status-ack.mjs .github/workflows/apply-external-unit-status-ack.yml
          git commit -m "Acknowledge outside-center status traffic [skip ci]"
          git push origin HEAD:fix/external-unit-status-ack
