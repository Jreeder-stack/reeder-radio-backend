name: Patch phone sibling PTT isolation

on:
  push:
    branches:
      - fix/phone-native-v6

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Patch same-unit sibling PTT isolation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-native-v6
      - name: Patch signaling isolation
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/services/signalingService.js')
          s = p.read_text()

          pre_pattern = r"  _handlePttPre\(socket, data\) \{\n(?:.|\n)*?\n  \}\n\n  _handlePttStart"
          pre_replacement = """  _handlePttPre(socket, data) {
            const channelId = canonicalChannelKey(data.channelId);
            if (!socket.unitId) return;
            // A second handset/radio signed in as the same unit must not react
            // to this unit's own pre-key event.
            this._emitToChannelExcludingUnit(channelId, 'ptt:pre', {
              unitId: socket.unitId,
              channelId,
            }, socket.unitId);
          }

          _handlePttStart"""
          s, n1 = re.subn(pre_pattern, pre_replacement, s, count=1)

          emit_pattern = r"  /\*\*\n   \* Like _emitToChannelExcludingUnit(?:.|\n)*?\n  _emitToChannelExcludingDevice\(channelId, event, data, excludeDeviceId\) \{(?:.|\n)*?\n  \}\n\n  _emitChannelFloorTakenToRoom"
          emit_replacement = """  /**
           * Emit radio TX state to other units while isolating every endpoint owned by
           * the transmitting unit. A user may be signed into both a phone and T320;
           * sibling endpoints must not enter RX/busy state from their own PTT.
           */
          _emitToChannelExcludingDevice(channelId, event, data, excludeDeviceId) {
            if (!this.io) return;
            const room = `channel:${channelId}`;
            const originUnitId = data?.senderUnitId || data?.unitId || data?.heldBy || null;
            this.io.sockets.sockets.forEach((s) => {
              if (!s.rooms || !s.rooms.has(room)) return;
              if (excludeDeviceId && s.deviceId === excludeDeviceId) return;
              if (originUnitId && s.unitId === originUnitId) return;
              s.emit(event, data);
            });
          }

          _emitChannelFloorTakenToRoom"""
          s, n2 = re.subn(emit_pattern, emit_replacement, s, count=1)

          floor_pattern = r"  _emitChannelFloorTakenToRoomExcludingDevice\(channelId, data, excludeDeviceId\) \{(?:.|\n)*?\n  \}\n\n  _findSocketByUnitId"
          floor_replacement = """  _emitChannelFloorTakenToRoomExcludingDevice(channelId, data, excludeDeviceId) {
            if (!this.io) return;
            const room = `channel:${channelId}`;
            const originUnitId = data?.heldBy || data?.unitId || data?.senderUnitId || null;
            this.io.sockets.sockets.forEach((s) => {
              if (!s.rooms || !s.rooms.has(room)) return;
              if (excludeDeviceId && s.deviceId === excludeDeviceId) return;
              if (originUnitId && s.unitId === originUnitId) return;
              if (s.isRadioDevice) {
                s.emit(RADIO_EVENTS.CHANNEL_FLOOR_TAKEN, data);
              } else {
                s.emit(RADIO_EVENTS.CHANNEL_BUSY, data);
              }
            });
          }

          _findSocketByUnitId"""
          s, n3 = re.subn(floor_pattern, floor_replacement, s, count=1)

          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f'Unsafe patch refused: pttPre={n1} txHelper={n2} floorHelper={n3}')
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "Jreeder-stack"
          git config user.email "227722155+Jreeder-stack@users.noreply.github.com"
          git add src/services/signalingService.js
          git commit -m "Patch same-unit sibling PTT isolation"
          git push origin HEAD:fix/phone-native-v6
