name: Patch phone sibling PTT isolation

on:
  push:
    branches:
      - fix/phone-native-v6

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Patch same-unit sibling PTT isolation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-native-v6
      - name: Patch signaling isolation
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/services/signalingService.js')
          s = p.read_text()

          old_pre = '''  _handlePttPre(socket, data) {
            const channelId = canonicalChannelKey(data.channelId);
            if (!socket.unitId) return;
            socket.to(`channel:${channelId}`).emit('ptt:pre', {
              unitId: socket.unitId,
              channelId,
            });
          }'''
          new_pre = '''  _handlePttPre(socket, data) {
            const channelId = canonicalChannelKey(data.channelId);
            if (!socket.unitId) return;
            // Do not make another handset/radio logged in as this same unit react
            // to the user's own pre-key event.
            this._emitToChannelExcludingUnit(channelId, 'ptt:pre', {
              unitId: socket.unitId,
              channelId,
            }, socket.unitId);
          }'''

          old_emit = '''  /**
           * Like _emitToChannelExcludingUnit but skips only the originating device's
           * sockets. This lets multiple devices on the same unitId (e.g. a T320 radio
           * and an external CAD client) coexist: the device that initiated the PTT is
           * skipped, while sibling devices on the same unitId still receive the event
           * and can enter RX.
           */
          _emitToChannelExcludingDevice(channelId, event, data, excludeDeviceId) {
            if (!this.io) return;
            const room = `channel:${channelId}`;
            this.io.sockets.sockets.forEach((s) => {
              if (!s.rooms || !s.rooms.has(room)) return;
              if (excludeDeviceId && s.deviceId === excludeDeviceId) return;
              s.emit(event, data);
            });
          }'''
          new_emit = '''  /**
           * Emit radio TX state to other units while isolating every endpoint owned by
           * the transmitting unit. A user may be signed into both a phone and T320;
           * their sibling device must not enter RX/busy state from their own PTT.
           */
          _emitToChannelExcludingDevice(channelId, event, data, excludeDeviceId) {
            if (!this.io) return;
            const room = `channel:${channelId}`;
            const originUnitId = data?.senderUnitId || data?.unitId || data?.heldBy || null;
            this.io.sockets.sockets.forEach((s) => {
              if (!s.rooms || !s.rooms.has(room)) return;
              if (excludeDeviceId && s.deviceId === excludeDeviceId) return;
              if (originUnitId && s.unitId === originUnitId) return;
              s.emit(event, data);
            });
          }'''

          old_floor = '''  _emitChannelFloorTakenToRoomExcludingDevice(channelId, data, excludeDeviceId) {
            if (!this.io) return;
            const room = `channel:${channelId}`;
            this.io.sockets.sockets.forEach((s) => {
              if (!s.rooms || !s.rooms.has(room)) return;
              if (excludeDeviceId && s.deviceId === excludeDeviceId) return;
              if (s.isRadioDevice) {
                s.emit(RADIO_EVENTS.CHANNEL_FLOOR_TAKEN, data);
              } else {
                s.emit(RADIO_EVENTS.CHANNEL_BUSY, data);
              }
            });
          }'''
          new_floor = '''  _emitChannelFloorTakenToRoomExcludingDevice(channelId, data, excludeDeviceId) {
            if (!this.io) return;
            const room = `channel:${channelId}`;
            const originUnitId = data?.heldBy || data?.unitId || data?.senderUnitId || null;
            this.io.sockets.sockets.forEach((s) => {
              if (!s.rooms || !s.rooms.has(room)) return;
              if (excludeDeviceId && s.deviceId === excludeDeviceId) return;
              if (originUnitId && s.unitId === originUnitId) return;
              if (s.isRadioDevice) {
                s.emit(RADIO_EVENTS.CHANNEL_FLOOR_TAKEN, data);
              } else {
                s.emit(RADIO_EVENTS.CHANNEL_BUSY, data);
              }
            });
          }'''

          for old, new, label in [(old_pre,new_pre,'ptt-pre'),(old_emit,new_emit,'tx-events'),(old_floor,new_floor,'floor')]:
              if old not in s:
                  raise SystemExit(f'Expected {label} block not found; refusing unsafe patch')
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "Jreeder-stack"
          git config user.email "227722155+Jreeder-stack@users.noreply.github.com"
          git add src/services/signalingService.js
          git commit -m "Patch same-unit sibling PTT isolation"
          git push origin HEAD:fix/phone-native-v6
