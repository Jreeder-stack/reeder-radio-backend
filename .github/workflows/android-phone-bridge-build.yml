name: Android Phone Bridge Build

on:
  push:
    branches:
      - feature/android-uhf-vox-bridge
  workflow_dispatch:

jobs:
  build-phone-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build phone debug APK
        run: gradle -p android-native :app:assemblePhoneDebug --stacktrace

      - name: Upload phone APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: command-comms-phone-bridge-debug
          path: android-native/app/build/outputs/apk/phone/debug/*.apk
          if-no-files-found: error
