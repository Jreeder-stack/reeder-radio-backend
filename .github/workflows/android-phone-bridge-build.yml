name: Android Phone and Bridge Build

on:
  push:
    branches:
      - feature/android-uhf-vox-bridge
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: phone
            task: assemblePhoneDebug
            artifact: command-comms-phone-debug
            output: android-native/app/build/outputs/apk/phone/debug/*.apk
          - label: bridge
            task: assembleBridgeDebug
            artifact: command-comms-phone-bridge-debug
            output: android-native/app/build/outputs/apk/bridge/debug/*.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build ${{ matrix.label }} debug APK
        run: gradle -p android-native :app:${{ matrix.task }} --stacktrace

      - name: Upload ${{ matrix.label }} APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
