name: Build multi AI dispatcher runtime

on:
  push:
    branches:
      - agent/multi-ai-runtime
    paths:
      - scripts/multi-ai-parts/**
      - .github/workflows/multi-ai-runtime-build.yml

permissions:
  contents: write

concurrency:
  group: multi-ai-runtime-build
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[multi-ai-runtime-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-ai-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reassemble and apply full runtime refactor
        run: |
          cat scripts/multi-ai-parts/part-* > /tmp/apply_multi_ai_runtime.py
          python -m py_compile /tmp/apply_multi_ai_runtime.py
          python /tmp/apply_multi_ai_runtime.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install backend dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Syntax checks
        run: |
          node --check src/services/runtimeContext.js
          node --check src/services/cadService.js
          node --check src/services/cadStatusCheckClient.js
          node --check src/services/aiDispatcherRuntimeManager.js
          node --check src/services/aiDispatchService.js
          node --check src/routes/aiDispatcherProfilesRouter.js
          node --check src/server.js
      - name: Isolation and status-check tests
        run: npx vitest run src/services/__tests__/multiAiRuntime.test.js src/services/__tests__/aiDispatch.statusCheck.test.js
      - name: Build admin client
        run: npm run build
      - name: Commit validated implementation
        run: |
          rm -rf scripts/multi-ai-parts .github/workflows/multi-ai-runtime-build.yml
          git config user.name "OpenAI Agent"
          git config user.email "agent@openai.com"
          git add -A
          git commit -m "[multi-ai-runtime-applied] Complete multi-center AI dispatcher runtime"
          git push origin HEAD:agent/multi-ai-runtime
