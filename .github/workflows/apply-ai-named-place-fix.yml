name: Apply AI named-place fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ai-named-place-fix.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-dispatcher-named-place-resolution
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply named-place fix and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('src/services/aiDispatchService.js')
          text = service.read_text()
          old_guard = """          if (address && !this._looksLikeAddress(address)) {
            this.log('CREATE_CALL_ADDRESS_NOT_REAL', { participantId, rawAddress: address });
            address = null;
          }
"""
          new_guard = """          const namedPlaceCandidate = Boolean(address && !this._looksLikeAddress(address));
          if (namedPlaceCandidate) {
            // Named premises such as fairgrounds, schools, stores, and parks
            // may not resemble numbered street addresses. Preserve them for
            // MAI / Google Places resolution instead of discarding them here.
            this.log('CREATE_CALL_NAMED_PLACE_CANDIDATE', { participantId, rawAddress: address });
          }
"""
          if old_guard not in text:
            raise SystemExit('expected create-call address guard not found')
          text = text.replace(old_guard, new_guard, 1)

          old_verify = """            if (addressSource === 'spoken') {
              const v = await this._verifyAddressForCall(address, { context: 'create', participantId });
              finalAddress = v.canonical || address;
              addressUnverified = !v.verified;
              addressLat = v.lat;
              addressLng = v.lng;
            }
            setUnitSessionState(participantId, DISPATCHER_STATE.AWAITING_CALL_CONFIRM, null, {
"""
          new_verify = """            if (addressSource === 'spoken') {
              const v = await this._verifyAddressForCall(address, { context: 'create', participantId });
              finalAddress = v.canonical || address;
              addressUnverified = !v.verified;
              addressLat = v.lat;
              addressLng = v.lng;
            }
            if (namedPlaceCandidate && addressUnverified) {
              setUnitSessionState(participantId, DISPATCHER_STATE.AWAITING_CALL_ADDRESS, null, {
                nature: matchedNature,
                additionalUnits,
                priority,
                arrivalStatus
              }, true);
              const unresolvedResp = `${participantId}, I couldn't verify ${address}. Go ahead with the street address or nearest cross street.`;
              await this.speak(unresolvedResp, participantId);
              this.addConversationExchange(participantId, transcript, unresolvedResp);
              break;
            }
            setUnitSessionState(participantId, DISPATCHER_STATE.AWAITING_CALL_CONFIRM, null, {
"""
          if old_verify not in text:
            raise SystemExit('expected create-call verification block not found')
          service.write_text(text.replace(old_verify, new_verify, 1))

          test_file = Path('src/services/__tests__/aiDispatch.task542.test.js')
          tests = test_file.read_text()
          if 'resolves a named place before deciding that a street address is missing' not in tests:
            test = r'''

  it('resolves a named place before deciding that a street address is missing', async () => {
    const llmIntentService = await import('../llmIntentService.js');
    llmIntentService.classifyIntent.mockResolvedValueOnce({
      intent: 'CREATE_CALL',
      slots: {
        nature: 'BUILDING CHECK',
        address: 'Fayette County Fair, Dunbar, PA',
        priority: 'medium',
        additionalUnits: [],
      },
    });
    locationService.forwardGeocode.mockResolvedValueOnce({
      source: 'MAI',
      displayName: 'Fayette County Fairgrounds, 132 Pechin Road, Dunbar, PA 15431',
      businessName: 'Fayette County Fairgrounds',
      lat: 39.976,
      lng: -79.614,
      houseNumber: '132',
      road: 'Pechin Road',
      city: 'Dunbar',
      state: 'PA',
      postcode: '15431',
      importance: 0.9,
      addressType: 'premise',
    });

    const d = makeDispatcher();
    await d.processTranscriptWithLLM(
      'start me a building check at Fayette County Fair in Dunbar',
      'INDIANA-1'
    );

    expect(locationService.forwardGeocode).toHaveBeenCalledWith(
      expect.stringMatching(/Fayette County Fair/i)
    );
    const session = cm.getUnitSessionState('INDIANA-1');
    expect(session.state).toBe(cm.DISPATCHER_STATE.AWAITING_CALL_CONFIRM);
    expect(session.slots).toMatchObject({
      nature: 'BUILDING CHECK',
      address: '132 Pechin Road, Dunbar, PA',
      addressUnverified: false,
      addressLat: 39.976,
      addressLng: -79.614,
    });
    expect(d.logs.some(l => l.event === 'CREATE_CALL_NAMED_PLACE_CANDIDATE')).toBe(true);
    expect(d.spoken[d.spoken.length - 1]).toMatch(/132 Pechin Road, Dunbar, PA/);
  });
'''
            marker = '\n});'
            idx = tests.rfind(marker)
            if idx < 0:
              raise SystemExit('final describe terminator not found')
            test_file.write_text(tests[:idx] + test + tests[idx:])

          Path('.github/workflows/fix-ai-named-place.yml').unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate focused dispatcher paths
        run: |
          node --check src/services/aiDispatchService.js
          npx vitest run \
            src/services/__tests__/aiDispatch.task542.test.js \
            src/services/__tests__/locationService.cadResolver.test.js \
            src/services/__tests__/dispatcherV2Conversation.test.js

      - name: Commit tested fix branch
        shell: bash
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve named places before requesting an address"
          timeout 60s git push --no-verify origin HEAD:fix/ai-dispatcher-named-place-resolution

      - name: Remove temporary main workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/apply-ai-named-place-fix.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary AI named-place workflow"
            timeout 60s git push --no-verify origin HEAD:main
          fi
