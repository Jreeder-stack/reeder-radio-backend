name: Patch phone dead air and page tone

on:
  push:
    branches:
      - fix/phone-dead-air-page-tone

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-dead-air-page-tone
          fetch-depth: 0

      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/RadioAudioEngine.kt')
          s = p.read_text()
          if 'import com.reedersystems.commandcomms.BuildConfig\n' not in s:
              s = s.replace('import android.util.Log\n', 'import android.util.Log\nimport com.reedersystems.commandcomms.BuildConfig\n', 1)

          anchor = '''    private fun selectAudioSource(): Int? {\n        val deviceKey = "${Build.MANUFACTURER}/${Build.MODEL}/API${Build.VERSION.SDK_INT}"\n\n'''
          insert = '''    private fun selectAudioSource(): Int? {\n        val deviceKey = "${Build.MANUFACTURER}/${Build.MODEL}/API${Build.VERSION.SDK_INT}"\n\n        if (BuildConfig.RADIO_DEVICE_TYPE == "android_phone") {\n            // Phone flavor stays on the normal media/A2DP route. The actual TX\n            // engine is here, so never select VOICE_COMMUNICATION on phones;\n            // that source is tied to HFP/SCO on many Android devices and can\n            // produce silence after the call-style route is intentionally cleared.\n            val candidates = mutableListOf(\n                Pair(MediaRecorder.AudioSource.MIC, "MIC"),\n                Pair(MediaRecorder.AudioSource.VOICE_RECOGNITION, "VOICE_RECOGNITION")\n            )\n            if (Build.VERSION.SDK_INT >= 24) {\n                candidates.add(Pair(MediaRecorder.AudioSource.UNPROCESSED, "UNPROCESSED"))\n            }\n\n            Log.d("[AudioCapture]", "PHONE_TX_AUDIO_SOURCE_PROBE_BEGIN device=$deviceKey candidates=${candidates.map { it.second }}")\n            val results = candidates.map { (source, name) -> probeAudioSource(source, name) }\n            val best = results.filter { it.accepted }.maxByOrNull { it.avgRms }\n                ?: results.filter { it.reason == "rms_too_low" }.maxByOrNull { it.avgRms }\n            if (best != null) {\n                Log.d("[AudioCapture]", "PHONE_TX_AUDIO_SOURCE_SELECTED source=${best.sourceName} avgRms=${String.format("%.1f", best.avgRms)} reason=phone_media_route device=$deviceKey")\n                txSessionStats.audioSource = best.sourceName\n                return best.source\n            }\n            Log.e("[AudioCapture]", "PHONE_TX_AUDIO_SOURCE_ALL_REJECTED device=$deviceKey")\n            txSessionStats.audioSource = "NONE"\n            return null\n        }\n\n'''
          if anchor not in s: raise SystemExit('RadioAudioEngine selectAudioSource anchor not found')
          s = s.replace(anchor, insert, 1)
          p.write_text(s)

          p = Path('android-native/app/src/main/java/com/reedersystems/commandcomms/messaging/CommandCommsFirebaseService.kt')
          s = p.read_text()
          old = '''        if (app.apiClient.radioToken != null) {\n            playPagingTone(app)\n        } else {\n            Log.w(TAG, "[BUILD-TONE-A-V2] Skipping tone: radioToken is null (radio not authenticated)")\n        }\n'''
          new = '''        // Dedicated radios authenticate with radioToken. The native phone\n        // authenticates with the normal user session, so radioToken is expected\n        // to be null there. Either authenticated path must receive the audible page.\n        if (app.apiClient.radioToken != null || app.sessionPrefs.hasSession) {\n            Log.d(TAG, "[PAGE-TONE] authenticated endpoint — playing paging tone radioToken=${app.apiClient.radioToken != null} userSession=${app.sessionPrefs.hasSession}")\n            playPagingTone(app)\n        } else {\n            Log.w(TAG, "[PAGE-TONE] Skipping tone: endpoint has neither radio token nor user session")\n        }\n'''
          if old not in s: raise SystemExit('Firebase page tone gate anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/RadioAudioEngine.kt \
                  android-native/app/src/main/java/com/reedersystems/commandcomms/messaging/CommandCommsFirebaseService.kt
          git diff --cached --check
          git commit -m "Fix phone TX capture and audible paging"
          git push origin HEAD:fix/phone-dead-air-page-tone
