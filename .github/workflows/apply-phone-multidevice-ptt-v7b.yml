name: Apply phone multi-device PTT v7b

on:
  push:
    branches: [fix/phone-multidevice-ptt-v7]

permissions:
  contents: write

jobs:
  patch-build:
    if: ${{ !contains(github.event.head_commit.message, '[generated phone ptt v7]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-multidevice-ptt-v7
          fetch-depth: 0

      - name: Patch PTT architecture
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub1(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              return out

          # ---- Android phone PTT: UI is not a second transmitter ----
          p = Path('android-native/app/src/main/java/com/reedersystems/commandcomms/ui/radio/RadioViewModel.kt')
          s = p.read_text()
          pattern = r'''(?m)^        Log\.d\(TAG, "onPttDown roomKey=\$\{channel\.roomKey\}"\)\n        app\.signalingRepository\.transmitPre\(channel\.roomKey\)\n        _uiState\.update \{ it\.copy\(pttState = PttState\.TRANSMITTING\) \}\n        app\.toneEngine\.playTalkPermitTone\(\)\n        pttStartJob = viewModelScope\.launch \{\n            sendServiceIntent\(BackgroundAudioService\.ACTION_PTT_DOWN\)\n        \}'''
          repl = '''        Log.d(TAG, "onPttDown roomKey=${channel.roomKey}")
                  // BackgroundAudioService is the single owner of the PTT transaction.
                  // The UI only marks the press as pending and forwards one DOWN event.
                  _uiState.update { it.copy(pttState = PttState.CONNECTING) }
                  pttStartJob = viewModelScope.launch {
                      sendServiceIntent(BackgroundAudioService.ACTION_PTT_DOWN)
                  }'''
          s = sub1(s, pattern, repl, 'phone single-owner PTT')
          s = s.replace('if (s.pttState == PttState.TRANSMITTING) {',
                        'if (s.pttState == PttState.TRANSMITTING || s.pttState == PttState.CONNECTING) {', 1)
          p.write_text(s)

          # ---- Signaling identity + device-targeted floor grant ----
          p = Path('src/services/signalingService.js')
          s = p.read_text()
          auth_pattern = r'''    if \(sessionUser\) \{\n      validatedUnitId = sessionUser\.unit_id \|\| sessionUser\.username \|\| unitId;\n      validatedUsername = sessionUser\.username \|\| username;\n      validatedIsDispatcher = sessionUser\.role === 'admin' \|\| sessionUser\.role === 'dispatcher' \|\| false;\n    \}\n\n    socket\.unitId = validatedUnitId;'''
          auth_repl = '''    if (sessionUser) {
                validatedUnitId = sessionUser.unit_id || sessionUser.username || unitId;
                validatedUsername = sessionUser.username || username;
                validatedIsDispatcher = sessionUser.role === 'admin' || sessionUser.role === 'dispatcher' || false;
              } else {
                // Native Socket.IO may not carry the REST cookie. Normalize the login
                // identity against users so phone + T320 share the same canonical unitId.
                try {
                  const userResult = await pool.query(
                    `SELECT id, username, unit_id, role
                       FROM users
                      WHERE username = $1 OR unit_id = $1 OR username = $2 OR unit_id = $2
                      LIMIT 1`,
                    [username, unitId]
                  );
                  if (userResult.rows.length > 0) {
                    const canonicalUser = userResult.rows[0];
                    validatedUnitId = canonicalUser.unit_id || canonicalUser.username || unitId;
                    validatedUsername = canonicalUser.username || username;
                    validatedIsDispatcher = canonicalUser.role === 'admin' || canonicalUser.role === 'dispatcher' || false;
                    sessionUser = canonicalUser;
                  }
                } catch (identityErr) {
                  console.warn('[Signaling] Canonical native identity lookup failed:', identityErr.message);
                }
              }

              socket.unitId = validatedUnitId;'''
          s = sub1(s, auth_pattern, auth_repl, 'canonical native identity')

          grant_pattern = r'''      socket\.emit\(RADIO_EVENTS\.PTT_GRANTED, \{\n        channelId,\n        senderUnitId: socket\.unitId,\n        timestamp: Date\.now\(\),\n      \}\);'''
          grant_repl = '''      socket.emit(RADIO_EVENTS.PTT_GRANTED, {
                  channelId,
                  senderUnitId: socket.unitId,
                  requestId: data.requestId || null,
                  targetDeviceId: socket.deviceId || null,
                  originSocketId: socket.id,
                  timestamp: Date.now(),
                });'''
          s = sub1(s, grant_pattern, grant_repl, 'device-targeted floor grant')

          s = s.replace('audioRelayService.refreshSubscriber(ch, socket.unitId)',
                        'audioRelayService.refreshSubscriber(ch, socket.deviceId || socket.unitId)')
          s = s.replace('audioRelayService.addSubscriber(channelId, socket.unitId, subscriberAddress, subscriberPort);',
                        'audioRelayService.addSubscriber(channelId, socket.unitId, subscriberAddress, subscriberPort, socket.deviceId || null, socket.isRadioDevice ? "radio" : (socket.deviceType || "native"));')
          s = s.replace('audioRelayService.removeSubscriber(channelId, socket.unitId);',
                        'audioRelayService.removeSubscriber(channelId, socket.deviceId || socket.unitId);')
          s = s.replace('const subscribedChannels = audioRelayService.getChannelsForSubscriber(socket.unitId);',
                        'const subscribedChannels = audioRelayService.getChannelsForSubscriber(socket.deviceId || socket.unitId);')
          guard_pattern = r'''    for \(const channelId of subscribedChannels\) \{\n      if \(this\._isUnitStillInChannel\(socket\.unitId, channelId, socket\)\) \{\n        console\.log\(`\[Signaling\] Skipping audio relay removal for \$\{socket\.unitId\} on \$\{channelId\}: another device for the same unit is still present`\);\n        continue;\n      \}\n      audioRelayService\.removeSubscriber\(channelId, socket\.deviceId \|\| socket\.unitId\);\n    \}'''
          guard_repl = '''    for (const channelId of subscribedChannels) {
                audioRelayService.removeSubscriber(channelId, socket.deviceId || socket.unitId);
              }'''
          s, _ = re.subn(guard_pattern, guard_repl, s, count=1)
          p.write_text(s)

          # ---- UDP relay subscribers are physical devices, not unit IDs ----
          p = Path('src/services/audioRelayService.js')
          s = p.read_text()
          start = s.index('  addSubscriber(channelId, unitId, address, port) {')
          end = s.index('  setSignalingService(signalingService) {', start)
          methods = '''  addSubscriber(channelId, unitId, address, port, deviceId = null, deviceType = null) {
              const key = canonicalChannelKey(channelId);
              if (!this.subscribers.has(key)) this.subscribers.set(key, new Map());
              const subs = this.subscribers.get(key);
              let subscriberKey = deviceId || null;
              if (!subscriberKey) {
                for (const [candidateKey, candidate] of subs) {
                  if (candidate.unitId === unitId && candidate.address === address && candidate.port === port) {
                    subscriberKey = candidateKey;
                    break;
                  }
                }
              }
              if (!subscriberKey) subscriberKey = `legacy:${unitId}:${address}:${port}`;
              const existingSub = subs.get(subscriberKey);
              if (existingSub && (existingSub.address !== address || existingSub.port !== port)) {
                console.log(`[AudioRelay] SUBSCRIBER_NAT_CHANGE key=${subscriberKey} unitId=${unitId} channelId=${key} oldAddr=${existingSub.address}:${existingSub.port} newAddr=${address}:${port}`);
              }
              subs.set(subscriberKey, {
                unitId,
                deviceId: deviceId || existingSub?.deviceId || null,
                deviceType: deviceType || existingSub?.deviceType || null,
                address,
                port,
                lastSeen: Date.now(),
              });
              if (!existingSub) console.log(`[AudioRelay] SUBSCRIBER_ADDED key=${subscriberKey} unitId=${unitId} deviceId=${deviceId || 'legacy'} channelId=${key} addr=${address}:${port}`);
            }

            refreshSubscriber(channelId, identifier) {
              const key = canonicalChannelKey(channelId);
              const subs = this.subscribers.get(key);
              if (!subs) return false;
              const exact = subs.get(identifier);
              if (exact) { exact.lastSeen = Date.now(); return true; }
              let refreshed = false;
              for (const sub of subs.values()) {
                if (sub.unitId === identifier) { sub.lastSeen = Date.now(); refreshed = true; }
              }
              return refreshed;
            }

            removeSubscriber(channelId, identifier) {
              const key = canonicalChannelKey(channelId);
              const subs = this.subscribers.get(key);
              if (!subs) return;
              if (!subs.delete(identifier)) {
                for (const [subKey, sub] of [...subs]) {
                  if (sub.unitId === identifier) subs.delete(subKey);
                }
              }
              if (subs.size === 0) this.subscribers.delete(key);
            }

            getChannelsForSubscriber(identifier) {
              const channels = [];
              for (const [channelId, subs] of this.subscribers) {
                if (subs.has(identifier) || [...subs.values()].some((sub) => sub.unitId === identifier)) channels.push(channelId);
              }
              return channels;
            }

            removeAllSubscriptions(identifier) {
              for (const [channelId, subs] of this.subscribers) {
                if (!subs.delete(identifier)) {
                  for (const [subKey, sub] of [...subs]) if (sub.unitId === identifier) subs.delete(subKey);
                }
                if (subs.size === 0) this.subscribers.delete(channelId);
              }
            }

          '''
          s = s[:start] + methods + s[end:]

          udp_pattern = r'''      for \(const \[subUnitId, subInfo\] of udpSubs\) \{\n        if \(subUnitId === senderUnitId\) continue;\n        try \{\n          this\.socket\.send\(rxPayload, 0, rxPayload\.length, subInfo\.port, subInfo\.address\);\n          udpSendCount\+\+;\n        \} catch \(err\) \{\n          udpSendErrors\+\+;\n          console\.error\(`\[AudioRelay\] Send error to \$\{subUnitId\}:`, err\.message\);\n        \}\n      \}'''
          udp_repl = '''      const sentEndpoints = new Set();
                for (const [subKey, subInfo] of udpSubs) {
                  if (subInfo.unitId === senderUnitId) continue;
                  const endpointKey = `${subInfo.address}:${subInfo.port}`;
                  if (sentEndpoints.has(endpointKey)) continue;
                  sentEndpoints.add(endpointKey);
                  try {
                    this.socket.send(rxPayload, 0, rxPayload.length, subInfo.port, subInfo.address);
                    udpSendCount++;
                  } catch (err) {
                    udpSendErrors++;
                    console.error(`[AudioRelay] Send error to ${subKey} unitId=${subInfo.unitId}:`, err.message);
                  }
                }'''
          s = sub1(s, udp_pattern, udp_repl, 'device-aware UDP broadcast')
          s = s.replace('const { channelId: channelIdNumeric, sequence, opusPayload, flags, timestampMs, senderUnitId } = parsed;',
                        'const { channelId: channelIdNumeric, sequence, opusPayload, flags, timestampMs, senderUnitId, senderDeviceId } = parsed;', 1)
          s = s.replace('this.addSubscriber(channelKey, senderUnitId, rinfo.address, rinfo.port);',
                        'this.addSubscriber(channelKey, senderUnitId, rinfo.address, rinfo.port, senderDeviceId || null);', 1)

          parser_pattern = r'''    const version = msg\.readUInt8\(offset\); offset \+= VERSION_LEN;\n    if \(version !== PACKET_VERSION\) return null;\n    const flags = msg\.readUInt8\(offset\); offset \+= FLAGS_LEN;\n    const channelId = msg\.readUInt16BE\(offset\); offset \+= CHANNEL_ID_LEN;\n    const sequence = msg\.readUInt16BE\(offset\); offset \+= SEQUENCE_LEN;\n    const timestampMs = msg\.readUInt32BE\(offset\); offset \+= TIMESTAMP_LEN;\n    const senderLen = msg\.readUInt8\(offset\); offset \+= SENDER_LEN_LEN;\n    if \(msg\.length < offset \+ senderLen \+ PAYLOAD_LEN_LEN\) return null;\n    const senderUnitId = msg\.subarray\(offset, offset \+ senderLen\)\.toString\('utf8'\);\n    offset \+= senderLen;\n    const payloadLength = msg\.readUInt16BE\(offset\); offset \+= PAYLOAD_LEN_LEN;\n    if \(payloadLength < 0 \|\| msg\.length < offset \+ payloadLength\) return null;\n    const opusPayload = payloadLength > 0 \? msg\.subarray\(offset, offset \+ payloadLength\) : Buffer\.alloc\(0\);\n    return \{ channelId, sequence, timestampMs, flags, senderUnitId, opusPayload \};'''
          parser_repl = '''    const version = msg.readUInt8(offset); offset += VERSION_LEN;
              if (version !== 1 && version !== 2) return null;
              const flags = msg.readUInt8(offset); offset += FLAGS_LEN;
              const channelId = msg.readUInt16BE(offset); offset += CHANNEL_ID_LEN;
              const sequence = msg.readUInt16BE(offset); offset += SEQUENCE_LEN;
              const timestampMs = msg.readUInt32BE(offset); offset += TIMESTAMP_LEN;
              const senderLen = msg.readUInt8(offset); offset += SENDER_LEN_LEN;
              if (msg.length < offset + senderLen + PAYLOAD_LEN_LEN) return null;
              const senderUnitId = msg.subarray(offset, offset + senderLen).toString('utf8');
              offset += senderLen;
              let senderDeviceId = null;
              if (version >= 2) {
                if (msg.length < offset + 1 + PAYLOAD_LEN_LEN) return null;
                const deviceLen = msg.readUInt8(offset); offset += 1;
                if (msg.length < offset + deviceLen + PAYLOAD_LEN_LEN) return null;
                senderDeviceId = deviceLen > 0 ? msg.subarray(offset, offset + deviceLen).toString('utf8') : null;
                offset += deviceLen;
              }
              const payloadLength = msg.readUInt16BE(offset); offset += PAYLOAD_LEN_LEN;
              if (payloadLength < 0 || msg.length < offset + payloadLength) return null;
              const opusPayload = payloadLength > 0 ? msg.subarray(offset, offset + payloadLength) : Buffer.alloc(0);
              return { channelId, sequence, timestampMs, flags, senderUnitId, senderDeviceId, opusPayload };'''
          s = sub1(s, parser_pattern, parser_repl, 'V1/V2 UDP parser')
          p.write_text(s)

          # ---- Phone-only device ID in UDP packet V2 ----
          p = Path('android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/UdpAudioTransport.kt')
          s = p.read_text()
          s = s.replace('private const val PACKET_VERSION: Byte = 1', 'private const val PACKET_VERSION: Byte = 1\nprivate const val PACKET_VERSION_DEVICE: Byte = 2', 1)
          s = s.replace('    var unitId: String = ""\n    var onPacketReceived:', '    var unitId: String = ""\n    var deviceId: String = ""\n    var onPacketReceived:', 1)
          f0 = s.index('    private fun framePacket(audioData: ByteArray): ByteArray {')
          f1 = s.index('    private fun startReceiveLoop()', f0)
          frame = '''    private fun framePacket(audioData: ByteArray): ByteArray {
              val seq = sequenceNumber++
              val senderBytes = unitId.toByteArray(Charsets.UTF_8)
              val senderLen = senderBytes.size.coerceAtMost(255)
              val deviceBytes = deviceId.toByteArray(Charsets.UTF_8)
              val deviceLen = deviceBytes.size.coerceAtMost(255)
              val useDeviceVersion = deviceLen > 0
              val channelNumeric = channelIndex
              val timestampMs = (System.currentTimeMillis() and 0xFFFFFFFFL).toInt()
              val extraDeviceBytes = if (useDeviceVersion) 1 + deviceLen else 0
              val frame = ByteArray(RADIO_HEADER_FIXED_LEN + senderLen + extraDeviceBytes + audioData.size)
              var offset = 0
              frame[offset++] = if (useDeviceVersion) PACKET_VERSION_DEVICE else PACKET_VERSION
              frame[offset++] = FLAG_FEC_HINT.toByte()
              frame[offset++] = ((channelNumeric shr 8) and 0xFF).toByte()
              frame[offset++] = (channelNumeric and 0xFF).toByte()
              frame[offset++] = ((seq shr 8) and 0xFF).toByte()
              frame[offset++] = (seq and 0xFF).toByte()
              frame[offset++] = ((timestampMs shr 24) and 0xFF).toByte()
              frame[offset++] = ((timestampMs shr 16) and 0xFF).toByte()
              frame[offset++] = ((timestampMs shr 8) and 0xFF).toByte()
              frame[offset++] = (timestampMs and 0xFF).toByte()
              frame[offset++] = senderLen.toByte()
              System.arraycopy(senderBytes, 0, frame, offset, senderLen)
              offset += senderLen
              if (useDeviceVersion) {
                  frame[offset++] = deviceLen.toByte()
                  System.arraycopy(deviceBytes, 0, frame, offset, deviceLen)
                  offset += deviceLen
              }
              frame[offset++] = ((audioData.size shr 8) and 0xFF).toByte()
              frame[offset++] = (audioData.size and 0xFF).toByte()
              System.arraycopy(audioData, 0, frame, offset, audioData.size)
              return frame
          }

          '''
          s = s[:f0] + frame + s[f1:]
          p.write_text(s)

          p = Path('android-native/app/src/main/java/com/reedersystems/commandcomms/audio/BackgroundAudioService.kt')
          s = p.read_text()
          anchor = '        engine.udpTransport.unitId = servicePrefs.unitId ?: app.sessionPrefs.unitId ?: ""\n'
          if anchor not in s: raise SystemExit('BackgroundAudioService unit identity anchor missing')
          s = s.replace(anchor, anchor + '''        engine.udpTransport.deviceId = if (com.reedersystems.commandcomms.BuildConfig.RADIO_DEVICE_TYPE == "android_phone") {
                    app.signalingClient.deviceId.orEmpty()
                } else {
                    ""
                }
          ''', 1)
          p.write_text(s)

          p = Path('android-native/app/build.gradle.kts')
          s = p.read_text().replace('            versionCode = 6\n            versionNameSuffix = "-phone-v6"', '            versionCode = 7\n            versionNameSuffix = "-phone-v7"', 1)
          p.write_text(s)

      - name: Validate server syntax and invariants
        run: |
          node --check src/services/signalingService.js
          node --check src/services/audioRelayService.js
          python - <<'PY'
          from pathlib import Path
          vm=Path('android-native/app/src/main/java/com/reedersystems/commandcomms/ui/radio/RadioViewModel.kt').read_text()
          assert 'app.signalingRepository.transmitPre(channel.roomKey)' not in vm
          assert 'pttState = PttState.CONNECTING' in vm
          sig=Path('src/services/signalingService.js').read_text()
          assert 'requestId: data.requestId || null' in sig
          assert 'targetDeviceId: socket.deviceId || null' in sig
          assert 'Canonical native identity lookup failed' in sig
          relay=Path('src/services/audioRelayService.js').read_text()
          assert 'subInfo.unitId === senderUnitId' in relay
          assert 'senderDeviceId' in relay
          udp=Path('android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/UdpAudioTransport.kt').read_text()
          assert 'PACKET_VERSION_DEVICE' in udp and 'var deviceId: String = ""' in udp
          bg=Path('android-native/app/src/main/java/com/reedersystems/commandcomms/audio/BackgroundAudioService.kt').read_text()
          assert 'RADIO_DEVICE_TYPE == "android_phone"' in bg
          PY

      - name: Build phone v7 APK
        working-directory: android-native
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePhoneDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: command-comms-phone-v7-debug
          path: android-native/app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error

      - name: Commit repair
        run: |
          git config user.name "Jreeder-stack"
          git config user.email "227722155+Jreeder-stack@users.noreply.github.com"
          git add src/services/signalingService.js src/services/audioRelayService.js android-native/app/src/main/java/com/reedersystems/commandcomms/ui/radio/RadioViewModel.kt android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/UdpAudioTransport.kt android-native/app/src/main/java/com/reedersystems/commandcomms/audio/BackgroundAudioService.kt android-native/app/build.gradle.kts
          git commit -m "Fix phone multi-device PTT and audio identity [generated phone ptt v7]"
          git push origin HEAD:fix/phone-multidevice-ptt-v7
