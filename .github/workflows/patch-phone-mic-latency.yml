name: Patch phone mic latency

on:
  push:
    branches:
      - fix/phone-dead-air-page-tone

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-dead-air-page-tone
          fetch-depth: 0
      - name: Patch actual phone TX path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/RadioAudioEngine.kt')
          s = p.read_text()

          start = s.index('        if (BuildConfig.RADIO_DEVICE_TYPE == "android_phone") {\n', s.index('private fun selectAudioSource'))
          end_marker = '\n        // When a wired accessory mic is attached'
          end = s.index(end_marker, start)
          replacement = '''        if (BuildConfig.RADIO_DEVICE_TYPE == "android_phone") {\n            // Phone PTT must be immediate. Do not open/close several temporary\n            // AudioRecord sessions on every key-down to probe sources; Samsung/\n            // MediaTek devices can take hundreds of ms per probe and may leave\n            // the final recorder in a muted/settling state. Use the handset MIC\n            // directly and keep the normal MEDIA/A2DP output route.\n            val source = MediaRecorder.AudioSource.MIC\n            val name = "MIC"\n            txSessionStats.audioSource = name\n            cachedSourceKey = deviceKey\n            cachedSourceValue = source\n            cachedSourceName = name\n            Log.d("[AudioCapture]", "PHONE_TX_AUDIO_SOURCE_SELECTED source=$name reason=direct_phone_mic_no_probe device=$deviceKey")\n            return source\n        }\n'''
          s = s[:start] + replacement + s[end:]

          old = '''                                        applyGain(monoFrame, monoFrameSizeBytes, txMicGain)\n                                        highPassFilter(monoFrame, monoFrameSizeBytes)\n                                        txNoiseGate(monoFrame, monoFrameSizeBytes)\n                                        lowPassFilter(monoFrame, monoFrameSizeBytes)\n'''
          new = '''                                        applyGain(monoFrame, monoFrameSizeBytes, txMicGain)\n                                        highPassFilter(monoFrame, monoFrameSizeBytes)\n                                        // The phone handset mic can arrive at a much lower level than\n                                        // the dedicated-radio VOIP path. The -42 dB radio noise gate\n                                        // was zeroing valid phone speech and producing "open carrier"\n                                        // dead air. Keep the gate for T320/SD7, bypass it on phones.\n                                        if (BuildConfig.RADIO_DEVICE_TYPE != "android_phone") {\n                                            txNoiseGate(monoFrame, monoFrameSizeBytes)\n                                        } else {\n                                            txGateOpen = true\n                                        }\n                                        lowPassFilter(monoFrame, monoFrameSizeBytes)\n'''
          if old not in s: raise SystemExit('DSP gate anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/RadioAudioEngine.kt
          git diff --cached --check
          git commit -m "Make phone PTT mic capture immediate and ungated"
          git push origin HEAD:fix/phone-dead-air-page-tone
