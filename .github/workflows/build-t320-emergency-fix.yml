name: Build T320 APK

on:
  push:
    branches:
      - agent/t320-emergency-no-auto-tx-apk

permissions:
  contents: read

jobs:
  build-t320:
    name: Build T320 debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build T320 debug APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleT320Debug

      - name: Upload T320 APK
        uses: actions/upload-artifact@v4
        with:
          name: command-comms-t320-emergency-no-auto-tx
          path: android-native/app/build/outputs/apk/t320/debug/app-t320-debug.apk
          if-no-files-found: error
          retention-days: 14
