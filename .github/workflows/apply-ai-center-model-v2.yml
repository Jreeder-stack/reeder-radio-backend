name: Apply AI dispatcher center model v2

on:
  push:
    branches:
      - agent/ai-dispatcher-center-model-v2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[center-model-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-dispatcher-center-model-v2
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-ai-center-model-v2.mjs')
          source = path.read_text()
          source = source.replace(r'\\`', r'\`').replace(r'\\${', r'\${')
          path.write_text(source)
          PY
          node tools/apply-ai-center-model-v2.mjs

      - name: Install dependencies
        run: npm ci

      - name: Validate backend syntax
        run: |
          node --check src/services/aiDispatcherRuntimeManager.js
          node --check src/services/aiDispatchService.js
          node --check src/routes/index.js

      - name: Run focused tests
        run: npx vitest run src/services/__tests__/aiDispatcherCenterModel.test.js src/services/__tests__/multiAiRuntime.test.js src/services/__tests__/aiDispatch.statusCheck.test.js

      - name: Build production client
        run: npm run build

      - name: Commit rebuilt implementation
        run: |
          rm -f tools/apply-ai-center-model-v2.mjs .github/workflows/apply-ai-center-model-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild AI dispatcher center ownership [center-model-applied]"
          git push origin HEAD:agent/ai-dispatcher-center-model-v2
