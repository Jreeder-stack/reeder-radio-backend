name: Trusted apply strict AI center isolation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strict-ai-center-isolation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python scripts/apply-strict-ai-center-isolation.py
      - run: npm ci
      - name: Validate syntax
        run: |
          node --check src/services/aiDispatchService.js
          node --check src/services/aiDispatcherRuntimeManager.js
          node --check src/services/cadService.js
          node --check src/services/__tests__/strictCenterIsolation.test.js
      - name: Run isolation regressions
        run: >-
          npx vitest run
          src/services/__tests__/strictCenterIsolation.test.js
          src/services/__tests__/multiAiRuntime.test.js
          src/services/__tests__/cadIntegrationPreflight.test.js
          src/services/dispatcherV2Planner.test.js
          src/services/__tests__/dispatcherV2Conversation.test.js
      - name: Commit validated source
        run: |
          rm -f .strict-ai-center-isolation-trigger
          rm -f .github/workflows/apply-strict-ai-center-isolation.yml
          rm -f scripts/apply-strict-ai-center-isolation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[skip ci] Enforce strict AI dispatch-center isolation"
          git push origin HEAD:agent/strict-ai-center-isolation
