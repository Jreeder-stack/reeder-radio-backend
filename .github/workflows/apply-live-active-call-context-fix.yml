name: Apply live active call context repair

on:
  push:
    branches:
      - agent/fix-live-active-call-context

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch live CAD context handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          planner_path = Path('src/services/dispatcherV2Planner.js')
          text = planner_path.read_text()

          old = "function sanitizeCall(call) {"
          new = "export function sanitizeCall(call) {"
          assert text.count(old) == 1, f'sanitizeCall signature count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = "    nature: cleanString(call.nature || call.call_nature || call.callNature || '', 120) || null,"
          new = "    nature: cleanString(call.nature || call.type || call.call_nature || call.callNature || call.call_type || '', 120) || null,"
          assert text.count(old) == 1, f'nature normalization count={text.count(old)}'
          text = text.replace(old, new, 1)

          marker = "function findRecentCall(recentActions, { createdOnly = false } = {}) {"
          assert marker in text
          insert_after = """function findRecentCall(recentActions, { createdOnly = false } = {}) {
  for (let index = recentActions.length - 1; index >= 0; index -= 1) {
    const action = recentActions[index];
    if (createdOnly && action.type !== 'CREATE_CALL') continue;
    if (!createdOnly && !['CREATE_CALL', 'ASSIGN_CALL', 'ASSIGN_OTHER_UNIT', 'UPDATE_CALL'].includes(action.type)) continue;
    const identifier = action.callNumber || action.callId;
    if (identifier) return identifier;
  }
  return null;
}
"""
          assert text.count(insert_after) == 1, 'findRecentCall block changed unexpectedly'
          replacement = insert_after + """
function plannerResponseText(plan) {
  return [plan?.spokenResponse, plan?.clarificationQuestion]
    .filter(Boolean)
    .join(' ')
    .trim();
}

export function planClaimsNoActiveCalls(plan) {
  const text = plannerResponseText(plan);
  if (!text) return false;
  return /\\bno active calls?\\b|\\bno calls? (?:are )?(?:active|found|available)\\b|\\bthere (?:are|is) no active calls?\\b/i.test(text);
}

export function planContradictsLiveCad(plan, operationalContext = {}) {
  const activeCalls = Array.isArray(operationalContext.activeCalls)
    ? operationalContext.activeCalls
    : [];
  return activeCalls.length > 0 && planClaimsNoActiveCalls(plan);
}
"""
          text = text.replace(insert_after, replacement, 1)

          old = """  if (!resolved && ['assign_unit_to_call', 'add_call_note', 'get_call_details', 'close_call', 'cancel_call'].includes(toolName)) {
    resolved = findRecentCall(recentActions);
  }

  if (resolved) args.callNumber = String(resolved);
"""
          new = """  if (!resolved && ['assign_unit_to_call', 'add_call_note', 'get_call_details', 'close_call', 'cancel_call'].includes(toolName)) {
    resolved = findRecentCall(recentActions);
  }

  // A deployment restart clears the in-memory recent-action cache. When the
  // selected dispatch center has exactly one live call, a conversational
  // reference such as \"that call\" is still unambiguous and must resolve from
  // CAD rather than being reported as no active calls.
  if (!resolved && activeCalls.length === 1
      && ['assign_unit_to_call', 'add_call_note', 'get_call_details', 'close_call', 'cancel_call'].includes(toolName)) {
    resolved = callIdentifier(activeCalls[0]);
  }

  if (resolved) args.callNumber = String(resolved);
"""
          assert text.count(old) == 1, f'context fallback block count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = "  const context = { currentCall: null, activeCalls: [], recentActions: [] };"
          new = "  const context = { currentCall: null, activeCalls: [], recentActions: [], activeCallsRead: false, activeCallsError: null };"
          assert text.count(old) == 1, f'operational context initializer count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = """    if (activeResult.status === 'fulfilled') {
      const raw = activeResult.value;
      const list = Array.isArray(raw?.calls) ? raw.calls
        : Array.isArray(raw?.results) ? raw.results
        : Array.isArray(raw?.data) ? raw.data
        : Array.isArray(raw) ? raw
        : [];
      context.activeCalls = list.slice(0, 30).map(sanitizeCall).filter(Boolean);
    }
"""
          new = """    if (activeResult.status === 'fulfilled') {
      const raw = activeResult.value;
      if (raw?.success === false) {
        context.activeCallsError = raw.error || raw.failureType || `CAD active-call read failed${raw.statusCode ? ` (${raw.statusCode})` : ''}`;
        console.warn(`[AI-DISPATCH-V2] Active call read failed: ${context.activeCallsError}`);
      } else if (raw == null) {
        context.activeCallsError = 'CAD returned an empty active-call response';
        console.warn(`[AI-DISPATCH-V2] Active call read failed: ${context.activeCallsError}`);
      } else {
        const list = Array.isArray(raw?.calls) ? raw.calls
          : Array.isArray(raw?.results) ? raw.results
          : Array.isArray(raw?.data) ? raw.data
          : Array.isArray(raw) ? raw
          : [];
        context.activeCalls = list.slice(0, 30).map(sanitizeCall).filter(Boolean);
        context.activeCallsRead = true;
      }
    } else {
      context.activeCallsError = activeResult.reason?.message || 'CAD active-call request rejected';
      console.warn(`[AI-DISPATCH-V2] Active call read failed: ${context.activeCallsError}`);
    }
"""
          assert text.count(old) == 1, f'active result block count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = "1. Use liveCadContext and recentActions before asking the unit for information. Never claim there are no active calls when activeCalls contains one."
          new = "1. Use liveCadContext and recentActions before asking the unit for information. Never claim there are no active calls when activeCalls contains one. If activeCallsRead is false, the CAD read failed; say CAD call data is unavailable rather than claiming the list is empty."
          assert text.count(old) == 1, f'prompt rule count={text.count(old)}'
          text = text.replace(old, new, 1)

          old = """    const candidate = await callPlannerModel(context);
    const plan = validateDispatcherV2Plan(candidate, { unitId, operationalContext });
    if (!plan) {
"""
          new = """    let candidate = await callPlannerModel(context);
    let plan = validateDispatcherV2Plan(candidate, { unitId, operationalContext });

    // The model is not allowed to contradict retrieved CAD facts. Retry once
    // with an explicit correction when it claims there are no calls despite a
    // non-empty live list. If it repeats the contradiction, fail honestly
    // instead of transmitting false CAD information.
    if (planContradictsLiveCad(plan, operationalContext)) {
      console.warn(`[AI-DISPATCH-V2] Planner contradicted live CAD; retrying: unit=${unitId}, activeCalls=${operationalContext.activeCalls.length}`);
      candidate = await callPlannerModel({
        ...context,
        plannerCorrection: `The live CAD response contains ${operationalContext.activeCalls.length} active call(s). Re-plan using those calls and do not state that no active calls exist.`,
      });
      plan = validateDispatcherV2Plan(candidate, { unitId, operationalContext });
    }

    if (plan && planClaimsNoActiveCalls(plan) && operationalContext.activeCallsRead === false) {
      console.warn(`[AI-DISPATCH-V2] Suppressed false empty-call claim after CAD read failure: unit=${unitId}, error=${operationalContext.activeCallsError || 'unknown'}`);
      return {
        intent: 'UNKNOWN',
        response: `${unitId}, unable to read active calls from CAD right now. Use the MDT or repeat shortly.`,
        dispatcherV2: {
          mode: 'contextual_tool_planner',
          cadReadFailed: true,
          error: operationalContext.activeCallsError || 'active_call_read_failed',
          latencyMs: Date.now() - startedAt,
        },
      };
    }

    if (planContradictsLiveCad(plan, operationalContext)) {
      return {
        intent: 'UNKNOWN',
        response: `${unitId}, CAD has active calls, but I could not safely determine which call you meant. Say the call number or call nature.`,
        dispatcherV2: {
          mode: 'contextual_tool_planner',
          contradictedLiveCad: true,
          activeCallCount: operationalContext.activeCalls.length,
          latencyMs: Date.now() - startedAt,
        },
      };
    }

    if (!plan) {
"""
          assert text.count(old) == 1, f'planner candidate block count={text.count(old)}'
          text = text.replace(old, new, 1)

          planner_path.write_text(text)

          test_path = Path('src/services/dispatcherV2Planner.test.js')
          tests = test_path.read_text()
          old = """  containsProtectedEmergencyTraffic,
  mapDispatcherV2PlanToLegacyResult,
  resolveContextualToolArguments,
  validateDispatcherV2Plan,
"""
          new = """  containsProtectedEmergencyTraffic,
  mapDispatcherV2PlanToLegacyResult,
  planContradictsLiveCad,
  resolveContextualToolArguments,
  sanitizeCall,
  validateDispatcherV2Plan,
"""
          assert tests.count(old) == 1, f'test import block count={tests.count(old)}'
          tests = tests.replace(old, new, 1)

          extra = r'''

  it('normalizes the radio API type field into the live call nature', () => {
    expect(sanitizeCall({
      call_id: 'uuid-1',
      call_number: '2026-00123',
      type: 'BUILDING CHECK',
      location: 'FAYETTE COUNTY FAIR',
      city: 'DUNBAR',
      status: 'assigned',
    })).toMatchObject({
      callId: 'uuid-1',
      callNumber: '2026-00123',
      nature: 'BUILDING CHECK',
      location: 'FAYETTE COUNTY FAIR',
      city: 'DUNBAR',
    });
  });

  it('resolves an unqualified call reference from the sole live CAD call after a restart', () => {
    const args = resolveContextualToolArguments('assign_unit_to_call', {
      unitId: '2301',
    }, {
      activeCalls: [{
        callId: 'uuid-1',
        callNumber: '2026-00123',
        nature: 'BUILDING CHECK',
        location: 'FAYETTE COUNTY FAIR',
      }],
      recentActions: [],
      currentCall: null,
    });

    expect(args.callNumber).toBe('2026-00123');
  });

  it('rejects a model claim that there are no calls when live CAD has one', () => {
    expect(planContradictsLiveCad({
      kind: 'control',
      action: 'CLARIFY',
      clarificationQuestion: 'No active calls found.',
    }, {
      activeCalls: [{ callNumber: '2026-00123' }],
    })).toBe(true);
  });
'''
          closing = '\n});\n'
          assert tests.endswith(closing), 'unexpected test file ending'
          tests = tests[:-len(closing)] + extra + closing
          test_path.write_text(tests)
          PY

      - run: npm ci

      - name: Validate syntax
        run: |
          node --check src/services/dispatcherV2Planner.js
          node --check src/services/dispatcherV2Planner.test.js

      - name: Run contextual dispatcher regressions
        run: >-
          npx vitest run
          src/services/dispatcherV2Planner.test.js
          src/services/__tests__/dispatcherV2Conversation.test.js
          src/services/__tests__/dispatcherToolPlanner.shadow.test.js
          src/services/__tests__/aiDispatch.callResolve.test.js
          src/services/__tests__/aiDispatch.task542.test.js
          src/services/__tests__/namedPlaceIntentResolver.test.js

      - name: Commit validated repair and remove one-time workflow
        run: |
          rm .github/workflows/apply-live-active-call-context-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/dispatcherV2Planner.js src/services/dispatcherV2Planner.test.js .github/workflows/apply-live-active-call-context-fix.yml
          git commit -m "Fix live active call context resolution [skip ci]"
          git push
