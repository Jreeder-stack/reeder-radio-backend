name: AI Dispatcher V3 CI

on:
  push:
    branches:
      - test/dispatcher-v3-01-01-baseline-20261028
    paths:
      - 'src/dispatcher-v3/**'
      - 'src/services/aiDispatcherRuntimeManager.js'
      - 'src/services/__tests__/dispatcherV3ManagerIntegration.test.js'
      - '.github/workflows/ai-dispatcher-v3-ci.yml'
  pull_request:
    paths:
      - 'src/dispatcher-v3/**'
      - 'src/services/aiDispatcherRuntimeManager.js'
      - 'src/services/aiDispatchService.js'
      - 'src/services/aiDispatcherSignaling.js'
      - 'src/services/cadService.js'
      - 'src/services/azureSpeechService.js'
      - 'src/services/audioRelayService.js'
      - 'src/services/floorControlService.js'
      - 'src/services/signalingService.js'
      - 'src/services/signalingFloorIdentityHardening.js'
      - 'src/services/pttProvenance.js'
      - 'src/services/__tests__/ptt*.test.js'
      - 'src/services/__tests__/dispatcherV3ManagerIntegration.test.js'
      - 'src/routes/pttRoutes.js'
      - 'src/controllers/dispatchController.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-dispatcher-v3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatcher-v3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax-check V3 runtime boundary
        run: |
          node --check src/services/aiDispatcherRuntimeManager.js
          node --check src/services/__tests__/dispatcherV3ManagerIntegration.test.js
          node --check src/services/aiDispatchService.js
          node --check src/services/aiDispatcherSignaling.js
          node --check src/dispatcher-v3/liveRuntime.js
          node --check src/dispatcher-v3/turnScheduler.js
          node --check src/dispatcher-v3/intentPlanner.js
          node --check src/dispatcher-v3/__tests__/auditBaseline.test.js
          node --check src/dispatcher-v3/__tests__/helpers/auditRuntimeHarness.js
          node --check src/services/pttProvenance.js
          node --check src/services/signalingService.js
          node --check src/services/signalingFloorIdentityHardening.js
          node --check src/routes/pttRoutes.js
          node --check src/controllers/dispatchController.js
          node --check src/dispatcher-v3/turnEnvelope.js
          node --check src/dispatcher-v3/speechPipeline.js
          node --check src/dispatcher-v3/actionExecutor.js
      - name: Verify legacy dispatcher engine is absent
        run: |
          test ! -e src/services/commandMatcher.js
          test ! -e src/services/dispatcherV2Planner.js
          test ! -e src/services/dispatcherToolPlanner.js
          test ! -e src/services/dispatcherToolRegistry.js
          test ! -e src/services/llmIntentService.js
          test ! -e src/services/llmIntentService.legacy.js
          test ! -e src/services/strictCenterIsolationBootstrap.js
          test ! -e src/services/aiDispatcherV3RuntimeInstaller.js
          ! grep -R "AI_DISPATCHER_RUNTIME.*legacy" src package.json
      - name: PTT credential adapters, configured routing and floor controls
        run: |
          mkdir -p reports
          npm test -- src/services/__tests__/pttIntakeAdapters.test.js src/services/__tests__/pttRuntimeRouting.test.js src/services/__tests__/signalingFloorIdentityHardening.test.js src/services/__tests__/audioRelaySiblingDeviceHardening.test.js src/services/__tests__/floorControlService.aiWatchdog.test.js --reporter=default --reporter=json --outputFile=reports/ptt-tests.json
      - name: Actual manager to V3 PTT integration with synthetic CAD
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports
          npm test -- src/services/__tests__/dispatcherV3ManagerIntegration.test.js --reporter=default --reporter=json --outputFile=reports/v3-manager-integration.json
      - name: V3 suite and known-defect baseline (not release acceptance)
        if: ${{ !cancelled() }}
        env:
          DISPATCHER_AUDIT_MODE: baseline
          DISPATCHER_AUDIT_REPORT: reports/dispatcher-audit-baseline.json
        run: |
          mkdir -p reports
          node --version > reports/runtime.txt
          npm run test:v3 -- --reporter=default --reporter=json --outputFile=reports/v3-tests.json
      - name: Preserve test and baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatcher-v3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
