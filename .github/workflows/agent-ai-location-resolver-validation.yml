name: Validate AI location resolver

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/ai-dispatch-mai-place-resolution'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate resolver
        run: |
          node --check src/services/locationService.js
          npm test -- src/services/__tests__/locationService.cadResolver.test.js src/services/__tests__/aiDispatch.task542.test.js

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/agent-ai-location-resolver-validation.yml
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary AI location validation workflow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
