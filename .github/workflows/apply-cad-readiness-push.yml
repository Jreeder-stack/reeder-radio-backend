name: Apply CAD readiness preflight

on:
  push:
    branches:
      - agent/cad-readiness-preflight

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply source patch
        run: python .github/scripts/apply-cad-readiness.py

      - run: npm ci

      - name: Validate syntax
        run: |
          node --check src/services/cadService.js
          node --check src/services/aiDispatcherRuntimeManager.js
          node --check src/services/__tests__/cadIntegrationPreflight.test.js

      - name: Run CAD and dispatcher regressions
        run: >-
          npx vitest run
          src/services/__tests__/cadIntegrationPreflight.test.js
          src/services/__tests__/multiAiRuntime.test.js
          src/services/dispatcherV2Planner.test.js
          src/services/__tests__/dispatcherV2Conversation.test.js

      - name: Build production client
        run: npm run build

      - name: Commit validated source and remove temporary files
        if: success()
        run: |
          rm -f .github/workflows/apply-cad-readiness-push.yml
          rm -f .github/workflows/validate-cad-readiness-preflight.yml
          rm -f .github/scripts/apply-cad-readiness.py
          rm -f .cad-preflight-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[skip ci] Enforce CAD readiness before AI startup"
          git push
