name: Run conversational AI dispatcher build

on:
  pull_request:
    branches:
      - agent/ai-dispatch-mai-place-resolution
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply conversational dispatcher patch
        run: python3 scripts/agent-ai-dispatcher-conversation-phase1.py

      - name: Install dependencies
        run: npm ci

      - name: Validate syntax and focused tests
        run: |
          node --check src/services/dispatcherV2Planner.js
          node --check src/services/aiDispatchService.js
          npm test -- src/services/dispatcherV2Planner.test.js src/services/dispatcherV2Conversation.test.js

      - name: Commit validated implementation
        run: |
          rm -f .github/workflows/agent-ai-dispatcher-conversation-phase1.yml
          rm -f .github/workflows/agent-ai-dispatcher-conversation-pr.yml
          rm -f scripts/agent-ai-dispatcher-conversation-phase1.py
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make AI dispatcher conversational across call follow-ups"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
