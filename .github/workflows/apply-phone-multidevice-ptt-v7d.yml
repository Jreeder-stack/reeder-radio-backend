name: Apply phone PTT v7 final
on:
  push:
    branches: [fix/phone-multidevice-ptt-v7]
permissions:
  contents: write
jobs:
  patch-build:
    if: ${{ !contains(github.event.head_commit.message, '[generated phone ptt v7]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-multidevice-ptt-v7
          fetch-depth: 0
      - name: Apply repair
        shell: python
        run: |
          from pathlib import Path
          import re

          # PHONE UI: service owns PTT. Non-phone behavior is preserved.
          p=Path('android-native/app/src/main/java/com/reedersystems/commandcomms/ui/radio/RadioViewModel.kt'); s=p.read_text()
          old='''        Log.d(TAG, "onPttDown roomKey=${channel.roomKey}")
                  app.signalingRepository.transmitPre(channel.roomKey)
                  _uiState.update { it.copy(pttState = PttState.TRANSMITTING) }
                  app.toneEngine.playTalkPermitTone()
                  pttStartJob = viewModelScope.launch {
                      sendServiceIntent(BackgroundAudioService.ACTION_PTT_DOWN)
                  }'''
          new='''        Log.d(TAG, "onPttDown roomKey=${channel.roomKey}")
                  if (com.reedersystems.commandcomms.BuildConfig.RADIO_DEVICE_TYPE == "android_phone") {
                      _uiState.update { it.copy(pttState = PttState.CONNECTING) }
                  } else {
                      app.signalingRepository.transmitPre(channel.roomKey)
                      _uiState.update { it.copy(pttState = PttState.TRANSMITTING) }
                      app.toneEngine.playTalkPermitTone()
                  }
                  pttStartJob = viewModelScope.launch {
                      sendServiceIntent(BackgroundAudioService.ACTION_PTT_DOWN)
                  }'''
          if old not in s: raise SystemExit('viewmodel PTT anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('if (s.pttState == PttState.TRANSMITTING) {','if (s.pttState == PttState.TRANSMITTING || s.pttState == PttState.CONNECTING) {',1)
          p.write_text(s)

          # SIGNALING: normalize native identity, target floor grant to the requesting device.
          p=Path('src/services/signalingService.js'); s=p.read_text()
          old='''    if (sessionUser) {
                validatedUnitId = sessionUser.unit_id || sessionUser.username || unitId;
                validatedUsername = sessionUser.username || username;
                validatedIsDispatcher = sessionUser.role === 'admin' || sessionUser.role === 'dispatcher' || false;
              }

              socket.unitId = validatedUnitId;'''
          if old not in s:
              old='''    if (sessionUser) {
      validatedUnitId = sessionUser.unit_id || sessionUser.username || unitId;
      validatedUsername = sessionUser.username || username;
      validatedIsDispatcher = sessionUser.role === 'admin' || sessionUser.role === 'dispatcher' || false;
    }

    socket.unitId = validatedUnitId;'''
          new='''    if (sessionUser) {
                validatedUnitId = sessionUser.unit_id || sessionUser.username || unitId;
                validatedUsername = sessionUser.username || username;
                validatedIsDispatcher = sessionUser.role === 'admin' || sessionUser.role === 'dispatcher' || false;
              } else {
                try {
                  const userResult = await pool.query(
                    `SELECT id, username, unit_id, role FROM users
                     WHERE username = $1 OR unit_id = $1 OR username = $2 OR unit_id = $2 LIMIT 1`,
                    [username, unitId]
                  );
                  if (userResult.rows.length > 0) {
                    const u = userResult.rows[0];
                    validatedUnitId = u.unit_id || u.username || unitId;
                    validatedUsername = u.username || username;
                    validatedIsDispatcher = u.role === 'admin' || u.role === 'dispatcher' || false;
                    sessionUser = u;
                  }
                } catch (identityErr) {
                  console.warn('[Signaling] Canonical native identity lookup failed:', identityErr.message);
                }
              }

              socket.unitId = validatedUnitId;'''
          if old not in s: raise SystemExit('signaling auth anchor missing')
          s=s.replace(old,new,1)
          old='''      socket.emit(RADIO_EVENTS.PTT_GRANTED, {
                  channelId,
                  senderUnitId: socket.unitId,
                  timestamp: Date.now(),
                });'''
          if old not in s:
              old='''      socket.emit(RADIO_EVENTS.PTT_GRANTED, {
        channelId,
        senderUnitId: socket.unitId,
        timestamp: Date.now(),
      });'''
          new='''      socket.emit(RADIO_EVENTS.PTT_GRANTED, {
                  channelId,
                  senderUnitId: socket.unitId,
                  requestId: data.requestId || null,
                  targetDeviceId: socket.deviceId || null,
                  originSocketId: socket.id,
                  timestamp: Date.now(),
                });'''
          if old not in s: raise SystemExit('PTT grant anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('audioRelayService.refreshSubscriber(ch, socket.unitId)','audioRelayService.refreshSubscriber(ch, socket.deviceId || socket.unitId)')
          s=s.replace('audioRelayService.addSubscriber(channelId, socket.unitId, subscriberAddress, subscriberPort);','audioRelayService.addSubscriber(channelId, socket.unitId, subscriberAddress, subscriberPort, socket.deviceId || null, socket.isRadioDevice ? "radio" : (socket.deviceType || "native"));')
          s=s.replace('audioRelayService.removeSubscriber(channelId, socket.unitId);','audioRelayService.removeSubscriber(channelId, socket.deviceId || socket.unitId);')
          s=s.replace('const subscribedChannels = audioRelayService.getChannelsForSubscriber(socket.unitId);','const subscribedChannels = audioRelayService.getChannelsForSubscriber(socket.deviceId || socket.unitId);')
          p.write_text(s)

          # RELAY: device-keyed subscribers with unit grouping; V1 remains supported.
          p=Path('src/services/audioRelayService.js'); s=p.read_text()
          a=s.index('  addSubscriber(channelId, unitId, address, port) {'); b=s.index('  setSignalingService(signalingService) {',a)
          methods='''  addSubscriber(channelId, unitId, address, port, deviceId = null, deviceType = null) {
              const key = canonicalChannelKey(channelId);
              if (!this.subscribers.has(key)) this.subscribers.set(key, new Map());
              const subs = this.subscribers.get(key);
              let subscriberKey = deviceId || null;
              if (!subscriberKey) {
                for (const [k, sub] of subs) {
                  if (sub.unitId === unitId && sub.address === address && sub.port === port) { subscriberKey = k; break; }
                }
              }
              if (!subscriberKey) {
                const candidates = [...subs.entries()].filter(([, sub]) => sub.unitId === unitId && sub.deviceId && sub.deviceType !== 'android_phone');
                if (candidates.length === 1) subscriberKey = candidates[0][0];
              }
              if (!subscriberKey) subscriberKey = `legacy:${unitId}:${address}:${port}`;
              const prev = subs.get(subscriberKey);
              subs.set(subscriberKey, { unitId, deviceId: deviceId || prev?.deviceId || null, deviceType: deviceType || prev?.deviceType || null, address, port, lastSeen: Date.now() });
            }

            refreshSubscriber(channelId, identifier) {
              const subs = this.subscribers.get(canonicalChannelKey(channelId));
              if (!subs) return false;
              const exact = subs.get(identifier);
              if (exact) { exact.lastSeen = Date.now(); return true; }
              let hit=false; for (const sub of subs.values()) if (sub.unitId === identifier) { sub.lastSeen=Date.now(); hit=true; }
              return hit;
            }

            removeSubscriber(channelId, identifier) {
              const key=canonicalChannelKey(channelId), subs=this.subscribers.get(key); if (!subs) return;
              if (!subs.delete(identifier)) for (const [k,sub] of [...subs]) if (sub.unitId===identifier) subs.delete(k);
              if (subs.size===0) this.subscribers.delete(key);
            }

            getChannelsForSubscriber(identifier) {
              const out=[]; for (const [ch,subs] of this.subscribers) if (subs.has(identifier) || [...subs.values()].some(sub=>sub.unitId===identifier)) out.push(ch); return out;
            }

            removeAllSubscriptions(identifier) {
              for (const [ch,subs] of this.subscribers) { if (!subs.delete(identifier)) for (const [k,sub] of [...subs]) if (sub.unitId===identifier) subs.delete(k); if (subs.size===0) this.subscribers.delete(ch); }
            }

          '''
          s=s[:a]+methods+s[b:]
          old='''      for (const [subUnitId, subInfo] of udpSubs) {
                if (subUnitId === senderUnitId) continue;
                try {
                  this.socket.send(rxPayload, 0, rxPayload.length, subInfo.port, subInfo.address);
                  udpSendCount++;
                } catch (err) {
                  udpSendErrors++;
                  console.error(`[AudioRelay] Send error to ${subUnitId}:`, err.message);
                }
              }'''
          if old not in s:
              old='''      for (const [subUnitId, subInfo] of udpSubs) {
        if (subUnitId === senderUnitId) continue;
        try {
          this.socket.send(rxPayload, 0, rxPayload.length, subInfo.port, subInfo.address);
          udpSendCount++;
        } catch (err) {
          udpSendErrors++;
          console.error(`[AudioRelay] Send error to ${subUnitId}:`, err.message);
        }
      }'''
          new='''      const sentEndpoints = new Set();
                for (const [subKey, subInfo] of udpSubs) {
                  if ((subInfo.unitId || subKey) === senderUnitId) continue;
                  const endpointKey = `${subInfo.address}:${subInfo.port}`;
                  if (sentEndpoints.has(endpointKey)) continue;
                  sentEndpoints.add(endpointKey);
                  try { this.socket.send(rxPayload, 0, rxPayload.length, subInfo.port, subInfo.address); udpSendCount++; }
                  catch (err) { udpSendErrors++; console.error(`[AudioRelay] Send error to ${subKey}:`, err.message); }
                }'''
          if old not in s: raise SystemExit('relay broadcast anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('const { channelId: channelIdNumeric, sequence, opusPayload, flags, timestampMs, senderUnitId } = parsed;','const { channelId: channelIdNumeric, sequence, opusPayload, flags, timestampMs, senderUnitId, senderDeviceId } = parsed;',1)
          s=s.replace('this.addSubscriber(channelKey, senderUnitId, rinfo.address, rinfo.port);','this.addSubscriber(channelKey, senderUnitId, rinfo.address, rinfo.port, senderDeviceId || null);',1)

          # V1/V2 parser by replacing the complete parser body through its return.
          pat=r'''    const version = msg\.readUInt8\(offset\); offset \+= VERSION_LEN;\n    if \(version !== PACKET_VERSION\) return null;\n    const flags = msg\.readUInt8\(offset\); offset \+= FLAGS_LEN;\n    const channelId = msg\.readUInt16BE\(offset\); offset \+= CHANNEL_ID_LEN;\n    const sequence = msg\.readUInt16BE\(offset\); offset \+= SEQUENCE_LEN;\n    const timestampMs = msg\.readUInt32BE\(offset\); offset \+= TIMESTAMP_LEN;\n    const senderLen = msg\.readUInt8\(offset\); offset \+= SENDER_LEN_LEN;\n    if \(msg\.length < offset \+ senderLen \+ PAYLOAD_LEN_LEN\) return null;\n    const senderUnitId = msg\.subarray\(offset, offset \+ senderLen\)\.toString\('utf8'\);\n    offset \+= senderLen;\n    const payloadLength = msg\.readUInt16BE\(offset\); offset \+= PAYLOAD_LEN_LEN;\n    if \(payloadLength < 0 \|\| msg\.length < offset \+ payloadLength\) return null;\n    const opusPayload = payloadLength > 0 \? msg\.subarray\(offset, offset \+ payloadLength\) : Buffer\.alloc\(0\);\n    return \{ channelId, sequence, timestampMs, flags, senderUnitId, opusPayload \};'''
          repl='''    const version = msg.readUInt8(offset); offset += VERSION_LEN;
              if (version !== 1 && version !== 2) return null;
              const flags = msg.readUInt8(offset); offset += FLAGS_LEN;
              const channelId = msg.readUInt16BE(offset); offset += CHANNEL_ID_LEN;
              const sequence = msg.readUInt16BE(offset); offset += SEQUENCE_LEN;
              const timestampMs = msg.readUInt32BE(offset); offset += TIMESTAMP_LEN;
              const senderLen = msg.readUInt8(offset); offset += SENDER_LEN_LEN;
              if (msg.length < offset + senderLen + PAYLOAD_LEN_LEN) return null;
              const senderUnitId = msg.subarray(offset, offset + senderLen).toString('utf8'); offset += senderLen;
              let senderDeviceId = null;
              if (version === 2) { const dl=msg.readUInt8(offset); offset += 1; if (msg.length < offset + dl + PAYLOAD_LEN_LEN) return null; senderDeviceId=dl ? msg.subarray(offset,offset+dl).toString('utf8') : null; offset += dl; }
              const payloadLength = msg.readUInt16BE(offset); offset += PAYLOAD_LEN_LEN;
              if (msg.length < offset + payloadLength) return null;
              const opusPayload = payloadLength > 0 ? msg.subarray(offset, offset + payloadLength) : Buffer.alloc(0);
              return { channelId, sequence, timestampMs, flags, senderUnitId, senderDeviceId, opusPayload };'''
          s,n=re.subn(pat,repl,s,count=1); 
          if n!=1: raise SystemExit('relay parser anchor missing')

          # Stale sweep must use the stored unitId, not the device-key map key.
          s=s.replace('for (const [unitId, sub] of subs) {','for (const [subscriberKey, sub] of subs) {\n        const unitId = sub.unitId || subscriberKey;',1)
          s=s.replace('subs.delete(unitId);\n          console.log(`[AudioRelay] SUBSCRIBER_STALE_REMOVED unitId=${unitId}', 'subs.delete(subscriberKey);\n          console.log(`[AudioRelay] SUBSCRIBER_STALE_REMOVED key=${subscriberKey} unitId=${unitId}',1)
          p.write_text(s)

          # PHONE-only UDP v2 packet carries persistent device ID; radios remain v1.
          p=Path('android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/UdpAudioTransport.kt'); s=p.read_text()
          s=s.replace('private const val PACKET_VERSION: Byte = 1','private const val PACKET_VERSION: Byte = 1\nprivate const val PACKET_VERSION_DEVICE: Byte = 2',1)
          s=s.replace('    var unitId: String = ""\n    var onPacketReceived:','    var unitId: String = ""\n    var deviceId: String = ""\n    var onPacketReceived:',1)
          a=s.index('    private fun framePacket(audioData: ByteArray): ByteArray {'); b=s.index('    private fun startReceiveLoop()',a)
          frame='''    private fun framePacket(audioData: ByteArray): ByteArray {
              val seq=sequenceNumber++; val sb=unitId.toByteArray(Charsets.UTF_8); val sl=sb.size.coerceAtMost(255)
              val db=deviceId.toByteArray(Charsets.UTF_8); val dl=db.size.coerceAtMost(255); val v2=dl>0
              val ts=(System.currentTimeMillis() and 0xFFFFFFFFL).toInt(); val frame=ByteArray(RADIO_HEADER_FIXED_LEN+sl+(if(v2) 1+dl else 0)+audioData.size); var o=0
              frame[o++]=if(v2) PACKET_VERSION_DEVICE else PACKET_VERSION; frame[o++]=FLAG_FEC_HINT.toByte(); frame[o++]=((channelIndex shr 8) and 0xFF).toByte(); frame[o++]=(channelIndex and 0xFF).toByte(); frame[o++]=((seq shr 8) and 0xFF).toByte(); frame[o++]=(seq and 0xFF).toByte(); frame[o++]=((ts shr 24) and 0xFF).toByte(); frame[o++]=((ts shr 16) and 0xFF).toByte(); frame[o++]=((ts shr 8) and 0xFF).toByte(); frame[o++]=(ts and 0xFF).toByte(); frame[o++]=sl.toByte(); System.arraycopy(sb,0,frame,o,sl); o+=sl
              if(v2){ frame[o++]=dl.toByte(); System.arraycopy(db,0,frame,o,dl); o+=dl }
              frame[o++]=((audioData.size shr 8) and 0xFF).toByte(); frame[o++]=(audioData.size and 0xFF).toByte(); System.arraycopy(audioData,0,frame,o,audioData.size); return frame
          }

          '''
          s=s[:a]+frame+s[b:]; p.write_text(s)
          p=Path('android-native/app/src/main/java/com/reedersystems/commandcomms/audio/BackgroundAudioService.kt'); s=p.read_text(); anchor='        engine.udpTransport.unitId = servicePrefs.unitId ?: app.sessionPrefs.unitId ?: ""\n'
          if anchor not in s: raise SystemExit('background identity anchor missing')
          s=s.replace(anchor,anchor+'''        engine.udpTransport.deviceId = if (com.reedersystems.commandcomms.BuildConfig.RADIO_DEVICE_TYPE == "android_phone") app.signalingClient.deviceId.orEmpty() else ""
          ''',1); p.write_text(s)
          p=Path('android-native/app/build.gradle.kts'); s=p.read_text(); old='            versionCode = 6\n            versionNameSuffix = "-phone-v6"';
          if old not in s: raise SystemExit('phone version anchor missing')
          p.write_text(s.replace(old,'            versionCode = 7\n            versionNameSuffix = "-phone-v7"',1))

      - name: Validate source
        run: |
          node --check src/services/signalingService.js
          node --check src/services/audioRelayService.js
          grep -q 'requestId: data.requestId || null' src/services/signalingService.js
          grep -q 'senderDeviceId' src/services/audioRelayService.js
          grep -q 'PACKET_VERSION_DEVICE' android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/UdpAudioTransport.kt
      - name: Commit source
        run: |
          git config user.name "Jreeder-stack"
          git config user.email "227722155+Jreeder-stack@users.noreply.github.com"
          git add src/services/signalingService.js src/services/audioRelayService.js android-native/app/src/main/java/com/reedersystems/commandcomms/ui/radio/RadioViewModel.kt android-native/app/src/main/java/com/reedersystems/commandcomms/audio/radio/UdpAudioTransport.kt android-native/app/src/main/java/com/reedersystems/commandcomms/audio/BackgroundAudioService.kt android-native/app/build.gradle.kts
          git commit -m "Fix phone multi-device PTT and audio identity [generated phone ptt v7]"
          git push origin HEAD:fix/phone-multidevice-ptt-v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Build phone v7
        run: gradle -p android-native :app:assemblePhoneDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: command-comms-phone-v7-debug
          path: android-native/app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
