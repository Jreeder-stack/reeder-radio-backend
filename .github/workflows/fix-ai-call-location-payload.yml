name: Apply structured AI call location fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ai-call-location-payload.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply structured named-place patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          resolver = Path('src/services/namedPlaceIntentResolver.js')
          resolver.write_text(r'''import locationService from './locationService.js';

const STREET_ADDRESS_RX = /(?:^\d+\s+\w|\b(?:st|street|ave|avenue|blvd|boulevard|rd|road|dr|drive|ln|lane|ct|court|way|pl|place|pike|hwy|highway)\b)/i;
const SELF_LOCATION_RX = /\b(?:my location|my current location|my gps|where i am|my position|this location|my detail|my assigned location)\b/i;

function clean(value) {
  return typeof value === 'string' ? value.trim().replace(/\s+/g, ' ') : '';
}

function normalizeToken(value) {
  return clean(value).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

function escapeRegex(value) {
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function sameText(a, b) {
  const left = normalizeToken(a);
  const right = normalizeToken(b);
  return !!left && left === right;
}

function stripDuplicateLocality(address, location) {
  const parts = clean(address).split(',').map(clean).filter(Boolean);
  if (parts.length <= 1) return parts[0] || '';

  const localityTokens = [
    location.city,
    location.municipality,
    location.township,
    location.town,
    location.village,
    location.state,
    location.stateCode,
    location.postcode,
  ].map(normalizeToken).filter(Boolean);

  while (parts.length > 1) {
    const normalizedPart = normalizeToken(parts[parts.length - 1]);
    const normalizedWithoutZip = normalizedPart.replace(/\b\d{5}(?:\s*\d{4})?\b/g, '').trim();
    const duplicate = localityTokens.some((token) =>
      normalizedPart === token ||
      normalizedWithoutZip === token ||
      normalizedPart === `${token} ${normalizeToken(location.postcode)}`.trim()
    );
    if (!duplicate) break;
    parts.pop();
  }

  return parts.join(', ');
}

export function looksLikeStreetAddress(value) {
  const address = clean(value);
  return address.length >= 5 && STREET_ADDRESS_RX.test(address);
}

export function isNamedPlaceIntentCandidate(result) {
  if (result?.intent !== 'CREATE_CALL') return false;
  const address = clean(result?.slots?.address);
  if (!address || SELF_LOCATION_RX.test(address)) return false;
  return !looksLikeStreetAddress(address);
}

export function buildResolvedNamedPlace(location) {
  if (!location || typeof location !== 'object') return null;

  const premise = clean(location.businessName || location.business_name || location.name);
  const houseNumber = clean(location.houseNumber || location.house_number);
  const rawRoad = clean(location.road || location.address || location.streetAddress);
  let street = stripDuplicateLocality(rawRoad, location);

  if (houseNumber && street) {
    const alreadyPrefixed = new RegExp(`^${escapeRegex(houseNumber)}\\b`, 'i').test(street);
    if (!alreadyPrefixed) street = `${houseNumber} ${street}`;
  } else if (houseNumber && !street) {
    street = houseNumber;
  }

  const municipality = clean(
    location.municipality || location.township || location.city || location.town || location.village
  );

  if (!looksLikeStreetAddress(street)) {
    const displayName = clean(location.displayName || location.formattedAddress || location.formatted_address);
    street = stripDuplicateLocality(displayName, location);
  }
  if (!looksLikeStreetAddress(street)) return null;

  const cadParts = [];
  if (premise && !sameText(premise, street)) cadParts.push(premise);
  cadParts.push(street);
  const cadAddress = cadParts.join(', ');
  const displayAddress = [cadAddress, municipality].filter(Boolean).join(', ');

  const lat = Number(location.lat ?? location.latitude);
  const lng = Number(location.lng ?? location.longitude ?? location.lon);

  return {
    displayAddress,
    cadAddress,
    premise: premise || null,
    street,
    municipality: municipality || null,
    lat: Number.isFinite(lat) ? lat : null,
    lng: Number.isFinite(lng) ? lng : null,
  };
}

export function buildCanonicalStreetAddress(location) {
  return buildResolvedNamedPlace(location)?.displayAddress || null;
}

export async function resolveNamedPlaceIntent(result, resolver = locationService) {
  if (!isNamedPlaceIntentCandidate(result)) return result;

  const spokenAddress = clean(result.slots.address);
  try {
    const location = await resolver.forwardGeocode(spokenAddress);
    const resolved = buildResolvedNamedPlace(location);
    if (!resolved) return result;

    return {
      ...result,
      slots: {
        ...result.slots,
        address: resolved.displayAddress,
        cadAddress: resolved.cadAddress,
        municipality: resolved.municipality,
        locationPremise: resolved.premise,
        locationStreet: resolved.street,
        addressLat: resolved.lat,
        addressLng: resolved.lng,
        resolvedNamedPlace: true,
      },
    };
  } catch {
    return result;
  }
}
''')

          service = Path('src/services/aiDispatchService.js')
          text = service.read_text()

          old = """          const nature = result.slots?.nature;\n          let address = normalizeAddress(result.slots?.address);\n          const additionalUnits = result.slots?.additionalUnits || [];\n          const priority = result.slots?.priority || 'medium';\n"""
          new = """          const nature = result.slots?.nature;\n          let address = normalizeAddress(result.slots?.address);\n          const cadAddress = normalizeAddress(result.slots?.cadAddress);\n          const resolvedMunicipality = normalizeAddress(result.slots?.municipality);\n          const resolvedNamedPlace = result.slots?.resolvedNamedPlace === true;\n          const resolvedAddressLat = Number(result.slots?.addressLat);\n          const resolvedAddressLng = Number(result.slots?.addressLng);\n          const additionalUnits = result.slots?.additionalUnits || [];\n          const priority = result.slots?.priority || 'medium';\n"""
          if old not in text:
            raise SystemExit('CREATE_CALL slot declaration anchor not found')
          text = text.replace(old, new, 1)

          old = "let addressSource = address ? 'spoken' : null;"
          new = "let addressSource = address ? (resolvedNamedPlace ? 'resolved_named_place' : 'spoken') : null;"
          if old not in text:
            raise SystemExit('addressSource anchor not found')
          text = text.replace(old, new, 1)

          old = """            let finalAddress = address;\n            let addressUnverified = false;\n            let addressLat = null, addressLng = null;\n            if (addressSource === 'spoken') {\n"""
          new = """            let finalAddress = address;\n            let addressUnverified = false;\n            let addressLat = Number.isFinite(resolvedAddressLat) ? resolvedAddressLat : null;\n            let addressLng = Number.isFinite(resolvedAddressLng) ? resolvedAddressLng : null;\n            if (addressSource === 'spoken') {\n"""
          if old not in text:
            raise SystemExit('verification anchor not found')
          text = text.replace(old, new, 1)

          old = """              nature: matchedNature,\n              address: finalAddress,\n              addressUnverified,\n"""
          new = """              nature: matchedNature,\n              address: finalAddress,\n              cadAddress: cadAddress || finalAddress,\n              municipality: resolvedMunicipality || null,\n              locationPremise: result.slots?.locationPremise || null,\n              locationStreet: result.slots?.locationStreet || null,\n              addressUnverified,\n"""
          if old not in text:
            raise SystemExit('confirmation slot anchor not found')
          text = text.replace(old, new, 1)

          old = """    const { nature, address, additionalUnits, priority, arrivalStatus, addressLat, addressLng, addressUnverified } = slots;\n"""
          new = """    const { nature, address, cadAddress, municipality, additionalUnits, priority, arrivalStatus, addressLat, addressLng, addressUnverified } = slots;\n"""
          if old not in text:
            raise SystemExit('executeCallCreation destructure anchor not found')
          text = text.replace(old, new, 1)

          old = "const cleanedAddress = normalizeAddress(address) || address;"
          new = "const cleanedAddress = normalizeAddress(cadAddress || address) || cadAddress || address;\n      const cleanedMunicipality = normalizeAddress(municipality) || '';"
          if old not in text:
            raise SystemExit('cleanedAddress anchor not found')
          text = text.replace(old, new, 1)

          old = """      const outgoingPayload = { nature, priority: priority || 'medium', address: cleanedAddress, municipality: '', notes: `Created by AI Dispatcher for ${participantId}`, units, lat: cadExtras.lat ?? null, lng: cadExtras.lng ?? null, addressUnverified: !!addressUnverified };\n"""
          new = """      const outgoingPayload = { nature, priority: priority || 'medium', address: cleanedAddress, municipality: cleanedMunicipality, displayAddress: address, notes: `Created by AI Dispatcher for ${participantId}`, units, lat: cadExtras.lat ?? null, lng: cadExtras.lng ?? null, addressUnverified: !!addressUnverified };\n"""
          if old not in text:
            raise SystemExit('outgoing payload anchor not found')
          text = text.replace(old, new, 1)

          old = """      const callResult = await cadService.createCall(nature, priority || 'medium', cleanedAddress, '', `Created by AI Dispatcher for ${participantId}`, units, cadExtras);\n"""
          new = """      const callResult = await cadService.createCall(nature, priority || 'medium', cleanedAddress, cleanedMunicipality, `Created by AI Dispatcher for ${participantId}`, units, cadExtras);\n"""
          if old not in text:
            raise SystemExit('cadService.createCall anchor not found')
          text = text.replace(old, new, 1)
          service.write_text(text)

          cad = Path('src/services/cadService.js')
          text = cad.read_text()
          old = """  const resolvedMunicipality = (municipality && municipality.trim()) ? municipality.trim() : parseMunicipalityFromAddress(location);\n  let finalLocation = location;\n  if (resolvedMunicipality && location.includes(',')) {\n    const parts = location.split(',').map(p => p.trim()).filter(Boolean);\n    if (parts.length >= 2) {\n      finalLocation = parts[0];\n    }\n  }\n"""
          new = """  const explicitMunicipality = (municipality && municipality.trim()) ? municipality.trim() : '';\n  const resolvedMunicipality = explicitMunicipality || parseMunicipalityFromAddress(location);\n  let finalLocation = location;\n  // Legacy unstructured addresses used `street, municipality`; split those only\n  // when no explicit municipality was supplied. Structured named places may use\n  // `premise, street` and must remain intact in the CAD location field.\n  if (!explicitMunicipality && resolvedMunicipality && location.includes(',')) {\n    const parts = location.split(',').map(p => p.trim()).filter(Boolean);\n    if (parts.length >= 2) {\n      finalLocation = parts[0];\n    }\n  }\n"""
          if old not in text:
            raise SystemExit('cadService municipality anchor not found')
          text = text.replace(old, new, 1)

          old = """    location: finalLocation.toUpperCase(),\n    municipality: resolvedMunicipality ? resolvedMunicipality.toUpperCase() : '',\n    notes: notes || '',\n"""
          new = """    location: finalLocation.toUpperCase(),\n    city: resolvedMunicipality ? resolvedMunicipality.toUpperCase() : '',\n    municipality: resolvedMunicipality ? resolvedMunicipality.toUpperCase() : '',\n    notes: notes || '',\n"""
          if old not in text:
            raise SystemExit('cadService body anchor not found')
          text = text.replace(old, new, 1)
          cad.write_text(text)

          tests = Path('src/services/__tests__/namedPlaceIntentResolver.test.js')
          tests.write_text(r'''import { describe, expect, it, vi } from 'vitest';
import {
  buildResolvedNamedPlace,
  isNamedPlaceIntentCandidate,
  resolveNamedPlaceIntent,
} from '../namedPlaceIntentResolver.js';

describe('named-place intent resolution', () => {
  it('recognizes a named premise as a location candidate', () => {
    expect(isNamedPlaceIntentCandidate({
      intent: 'CREATE_CALL',
      slots: { address: 'Fayette County Fair, Dunbar, PA' },
    })).toBe(true);
  });

  it('keeps ordinary street addresses on the normal verification path', async () => {
    const resolver = { forwardGeocode: vi.fn() };
    const result = {
      intent: 'CREATE_CALL',
      slots: { nature: 'BUILDING CHECK', address: '132 Pechin Road, Dunbar, PA' },
    };

    await expect(resolveNamedPlaceIntent(result, resolver)).resolves.toBe(result);
    expect(resolver.forwardGeocode).not.toHaveBeenCalled();
  });

  it('keeps premise, street, and municipality separate without duplicating city/state', () => {
    expect(buildResolvedNamedPlace({
      source: 'MAI',
      businessName: 'Fayette County Fair',
      address: '132 Pechin Road, Dunbar, PA',
      road: '132 Pechin Road, Dunbar, PA',
      city: 'Dunbar',
      municipality: 'Dunbar Township',
      state: 'PA',
      lat: 39.976,
      lng: -79.614,
    })).toEqual({
      displayAddress: 'Fayette County Fair, 132 Pechin Road, Dunbar Township',
      cadAddress: 'Fayette County Fair, 132 Pechin Road',
      premise: 'Fayette County Fair',
      street: '132 Pechin Road',
      municipality: 'Dunbar Township',
      lat: 39.976,
      lng: -79.614,
    });
  });

  it('returns structured slots for the dispatcher readback and CAD write', async () => {
    const resolver = {
      forwardGeocode: vi.fn().mockResolvedValue({
        source: 'MAI',
        businessName: 'Fayette County Fair',
        road: '132 Pechin Road, Dunbar, PA',
        city: 'Dunbar',
        municipality: 'Dunbar Township',
        state: 'PA',
        lat: 39.976,
        lng: -79.614,
      }),
    };
    const result = {
      intent: 'CREATE_CALL',
      slots: { nature: 'BUILDING CHECK', address: 'Fayette County Fair, Dunbar, PA' },
    };

    await expect(resolveNamedPlaceIntent(result, resolver)).resolves.toMatchObject({
      slots: {
        address: 'Fayette County Fair, 132 Pechin Road, Dunbar Township',
        cadAddress: 'Fayette County Fair, 132 Pechin Road',
        municipality: 'Dunbar Township',
        locationPremise: 'Fayette County Fair',
        locationStreet: '132 Pechin Road',
        addressLat: 39.976,
        addressLng: -79.614,
        resolvedNamedPlace: true,
      },
    });
  });

  it('keeps the original named place when lookup fails', async () => {
    const resolver = { forwardGeocode: vi.fn().mockResolvedValue(null) };
    const result = { intent: 'CREATE_CALL', slots: { address: 'Fayette County Fair' } };
    await expect(resolveNamedPlaceIntent(result, resolver)).resolves.toBe(result);
  });
});
''')
