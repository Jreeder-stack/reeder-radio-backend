name: Build SD7 APK

on:
  push:
    branches:
      - main
    paths:
      - "android-native/**"
      - ".github/workflows/build-sd7.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android-native/**"
      - ".github/workflows/build-sd7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sd7:
    name: Build SD7 debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build SD7 debug APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleSd7Debug

      - name: Upload SD7 APK
        uses: actions/upload-artifact@v4
        with:
          name: command-comms-sd7-debug
          path: android-native/app/build/outputs/apk/sd7/debug/app-sd7-debug.apk
          if-no-files-found: error
          retention-days: 14
