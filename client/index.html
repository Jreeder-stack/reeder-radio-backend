<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06080c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#06080c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Command" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-startup-image" href="/icons/icon-512.png" />
    <title>Command Communications by Reeder - Systems</title>
    <style>
      html, body { background-color: #06080c; }
      #root { background-color: #06080c; min-height: 100dvh; }
      .__boot_splash {
        position: fixed;
        inset: 0;
        background: #06080c;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        z-index: 9999;
        color: #58a6ff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .__boot_splash img { width: 96px; height: 96px; opacity: 0.95; }
      .__boot_splash .__boot_label {
        font-size: 14px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #8b949e;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="__boot_splash" id="__boot_splash">
        <img src="/icons/icon-192.png" alt="Command" />
        <div class="__boot_label">Command</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
